-contrast minimalist aesthetic featuring glowing cyan paths, white light-balls, and vibrant particles against a deep black background with a sleek dark-mode UI","tagZh":"赛博朋克霓虹极简","textZh":"高对比度的极简美学，在深黑背景上呈现发光的青色轨迹、白色光球和鲜艳粒子，并配以时尚的暗色模式 UI"},"mood":{"tag":"satisfying synthwave","text":"relaxing yet addictive synthwave vibe with satisfying tactile feedback from physics collisions and glowing visual effects","tagZh":"满足感合成波","textZh":"轻松却令人上瘾的合成波氛围，配以物理碰撞和发光视觉效果带来的满足触感反馈"},"interaction":{"tag":"draw and click","text":"draw lines by dragging across the screen; tap buttons to manage upgrades and view local leaderboards","tagZh":"绘制与点击","textZh":"在屏幕上拖动来绘制线条；点击按钮管理升级并查看本地排行榜"},"social":{"tag":"single-player","text":"single-player experience featuring a local simulated leaderboard to track earning progress","tagZh":"单人","textZh":"单人体验，配有本地模拟排行榜以追踪收益进度"}},"0074c901-ca65-458d-bb4b-022e1448a122":{"subject":{"tag":"army vs zombies","text":"a growing troop of blue capsule soldiers running along a green road lane, battling waves of red capsule zombies","tagZh":"军队大战僵尸","textZh":"一支不断壮大的蓝色胶囊士兵队伍沿着绿色道路奔跑，迎战一波波红色胶囊僵尸"},"gameplay":{"tag":"troop-multiplier runner","text":"3D forward-scrolling runner where players pass through multiplier gates to grow their army and automatically shoot oncoming zombies; survival depends on maintaining troop count above zero while avoiding obstacles","tagZh":"兵力倍增跑酷","textZh":"一款 3D 向前滚动的跑酷游戏，玩家穿过倍增门来壮大军队并自动射击迎面而来的僵尸；生存的关键在于避开障碍的同时保持兵力大于零"},"artStyle":{"tag":"low-poly 3D arcade","text":"minimalist low-poly 3D aesthetic featuring a vibrant green road, sky-blue background, and color-coded capsule entities with translucent numerical gates","tagZh":"低多边形 3D 街机","textZh":"极简的低多边形 3D 美学，包括鲜艳的绿色道路、天蓝色背景，以及配有半透明数字门的按颜色区分的胶囊实体"},"mood":{"tag":"intense satisfying action","text":"fast-paced and addictive with a sense of escalating power from army growth and rhythmic zombie elimination","tagZh":"激烈满足的动作","textZh":"节奏明快、令人上瘾，随着军队壮大和有节奏地消灭僵尸带来不断升级的力量感"},"interaction":{"tag":"horizontal slide","text":"horizontal slide or drag to steer the troop formation across the track lane, with automatic projectile firing","tagZh":"水平滑动","textZh":"水平滑动或拖动来操控队伍在赛道上移动，并自动发射弹药"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global high-score leaderboard for the top troop commanders","tagZh":"异步竞技","textZh":"异步竞技，配有面向顶尖部队指挥官的全球高分排行榜"}},"00796413-6c72-4ea9-81ab-5c49e893d738":{"subject":{"tag":"surreal cat world","text":"a walking cat navigating floating pastel-colored cubic blocks and architectural illusions in a dreamy sky setting.","tagZh":"超现实猫咪世界","textZh":"在梦幻的天空场景中，一只行走的猫咪穿行于漂浮的柔和色调方块和建筑错觉之间。"},"gameplay":{"tag":"perspective puzzle","text":"rotate the 3D camera to align disconnected paths through optical illusions; guide a cat across gaps by matching specific viewing angles to bridge spatial voids.","tagZh":"视角解谜","textZh":"旋转 3D 镜头，借助视觉错觉将断开的路径对齐；通过匹配特定的观察角度来跨越空隙、连接空间断层，引导猫咪前进。"},"artStyle":{"tag":"minimalist pastel 3D","text":"3D isometric aesthetic with a minimalist pastel palette, featuring glowing edges, soft gradients, and high-contrast light blocks.","tagZh":"极简柔彩 3D","textZh":"3D 等距视角美学，采用极简的柔和色调配色，配以发光边缘、柔和渐变和高对比度的明亮方块。"},"mood":{"tag":"dreamy and serene","text":"dreamy, soothing, and serene atmosphere supported by ethereal music, soft meow sound effects, and low-pressure logic.","tagZh":"梦幻宁静","textZh":"梦幻、舒缓而宁静的氛围，配以空灵的音乐、柔和的喵喵音效和低压力的逻辑玩法。"},"interaction":{"tag":"drag to rotate","text":"drag to rotate the camera perspective; click to start and navigate level transition menus.","tagZh":"拖动旋转","textZh":"拖动来旋转镜头视角；点击以开始游戏并操作关卡切换菜单。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01a6a483-ed24-4a0a-8d75-9f8d161e062a":{"subject":{"tag":"singing rainbow garden","text":"a garden of anthropomorphic rainbow-colored flowers that wake up to sing, each featuring unique personalities, eyes, and accessory details like glasses.","tagZh":"歌唱彩虹花园","textZh":"一座拟人化的彩虹色花朵花园，它们苏醒后便会歌唱，每朵花都有独特的个性、眼睛，以及眼镜等配饰细节。"},"gameplay":{"tag":"musical memory sandbox","text":"a dual-mode experience featuring a sandbox for free musical experimentation and a Simon-style memory challenge where players repeat increasingly complex sequences of musical notes.","tagZh":"音乐记忆沙盒","textZh":"一款双模式体验，既有供自由音乐实验的沙盒，也有西蒙记忆式挑战，玩家需重复越来越复杂的音符序列。"},"artStyle":{"tag":"vibrant minimalist vector","text":"vibrant minimalist art with high-contrast vector-style rendering on a black background, featuring concentric arcs, spring-based animations, and stylized particles like hearts and musical notes.","tagZh":"鲜艳极简矢量","textZh":"鲜艳的极简艺术风格，在黑色背景上进行高对比度的矢量风格渲染，包含同心圆弧、弹簧动画，以及爱心和音符等风格化粒子。"},"mood":{"tag":"whimsical and soothing","text":"cheerful, whimsical, and soothing, characterized by harmonious choir sounds and playful visual feedback.","tagZh":"奇趣舒缓","textZh":"欢快、奇趣而舒缓，以和谐的合唱音效和俏皮的视觉反馈为特色。"},"interaction":{"tag":"tap-to-sing","text":"tap and click interactions to wake flowers, trigger singing animations, and play musical notes, with a toggle for switching between creative and competitive modes.","tagZh":"点击歌唱","textZh":"通过点按和点击来唤醒花朵、触发歌唱动画并奏响音符，并可切换在创作模式与竞技模式之间转换。"},"social":{"tag":"single-player","text":"single-player experience focused on personal musical creativity and high-score memory testing.","tagZh":"单人","textZh":"单人体验，聚焦于个人音乐创作和高分记忆测试。"}},"0149a84d-b862-4e8b-85f7-cc93f84a29e0":{"subject":{"tag":"cat bakery","text":"a cute bakery setting featuring a waiting cat and custom-built cakes with various frostings and toppings","tagZh":"猫咪烘焙坊","textZh":"一个可爱的烘焙坊场景，有一只等待中的猫咪，以及可自定义搭配各种糖霜和配料的蛋糕"},"gameplay":{"tag":"arcade cake assembly","text":"speed-based assembly loop where players tap through stages to add a cake base, choose frosting colors, and select toppings to serve as many cats as possible within a 30-second time limit","tagZh":"街机蛋糕组装","textZh":"一款以速度为核心的组装循环玩法，玩家逐步点击添加蛋糕胚、选择糖霜颜色并挑选配料，在 30 秒时限内尽可能多地招待猫咪"},"artStyle":{"tag":"bright cartoon","text":"bright and colorful cartoon style with pink bakery backgrounds, smooth animations, and high-contrast UI buttons","tagZh":"明亮卡通","textZh":"明亮多彩的卡通风格，配有粉色烘焙坊背景、流畅的动画和高对比度的 UI 按钮"},"mood":{"tag":"cheerful and frantic","text":"cheerful and frantic, combining upbeat music and cute cat feedback with the pressure of a ticking timer","tagZh":"欢快而忙乱","textZh":"欢快而忙乱，将轻快的音乐和可爱的猫咪反馈与倒计时的压力相结合"},"interaction":{"tag":"tap selection","text":"click and tap interactions for assembling cake layers and selecting ingredients from a bottom-sheet menu","tagZh":"点击选择","textZh":"通过点击和点按互动来组装蛋糕层，并从底部弹出菜单中选择配料"},"social":{"tag":"single-player","text":"single-player game focused on high-score chasing within a local session","tagZh":"单人","textZh":"单人游戏，聚焦于在本地会话中冲刺高分"}},"0216e6ba-14ef-4140-98ed-f150f46e9245":{"subject":{"tag":"artistic zen paper","text":"a digital ink-and-paper drawing surface featuring textured paper backgrounds and varying ink colors","tagZh":"艺术禅意纸墨","textZh":"一个数字水墨绘画界面，配有带纹理的纸张背景和多变的墨色"},"gameplay":{"tag":"creative drawing sandbox","text":"freeform drawing sandbox where stroke width dynamically adjusts based on pointer speed; features particle ink splatters and a canvas clearing mechanic","tagZh":"创意绘画沙盒","textZh":"一款自由绘画沙盒，笔画宽度会根据指针速度动态调整；具备粒子墨点飞溅和画布清除机制"},"artStyle":{"tag":"minimalist paper craft","text":"minimalist aesthetic with realistic paper textures, fluid brush stroke rendering, and a clean floating UI palette","tagZh":"极简纸艺","textZh":"极简美学，配有逼真的纸张纹理、流畅的笔触渲染和简洁的悬浮 UI 调色板"},"mood":{"tag":"soothing zen","text":"relaxing and meditative atmosphere supported by soft haptic feedback and gentle audio cues","tagZh":"舒缓禅意","textZh":"轻松冥想的氛围，配以柔和的触感反馈和温和的音效提示"},"interaction":{"tag":"vibration-enhanced drawing","text":"pointer-based drawing with vibration feedback on initial contact; includes color selection buttons and a clear action","tagZh":"振动增强绘画","textZh":"基于指针的绘画，在初次接触时提供振动反馈；包含颜色选择按钮和清除操作"},"social":{"tag":"single-player","text":"single-player experience focused on personal creative expression","tagZh":"单人","textZh":"单人体验，聚焦于个人创意表达"}},"01e7dc90-5558-4240-9b86-481fd9d6caa1":{"subject":{"tag":"gymnastics vault arena","text":"a gymnast performing high bar flips and dismounts over a safety mat in a gym setting","tagZh":"体操跳跃竞技场","textZh":"在体育馆场景中，一名体操运动员在安全垫上方进行高低杠翻转和下杠动作"},"gameplay":{"tag":"physics timing arcade","text":"timing-based release from a swinging bar to perform single, double, or triple flips; goal is to land upright on a landing mat across 50 levels of increasing distance and speed","tagZh":"物理计时街机","textZh":"在摆动的单杠上把握时机松手，完成单周、双周或三周翻转；目标是在 50 个距离和速度递增的关卡中稳稳落在着陆垫上"},"artStyle":{"tag":"minimalist 2D vector","text":"clean 2D vector graphics with a dark slate background, a yellow stick-figure gymnast, and high-contrast UI elements","tagZh":"极简 2D 矢量","textZh":"简洁的 2D 矢量图形，配有深石板灰背景、黄色火柴人体操运动员和高对比度的 UI 元素"},"mood":{"tag":"tense but satisfying","text":"tense during the airborne flip phase, followed by high satisfaction from a perfect stick landing or a silly crash","tagZh":"紧张却满足","textZh":"在空中翻转阶段令人紧张，随后完美稳落或滑稽摔倒都带来极大的满足感"},"interaction":{"tag":"button click timing","text":"button click controls for selecting flip intensity during the swing cycle","tagZh":"按钮点击计时","textZh":"在摆动周期中通过点击按钮来选择翻转强度"},"social":{"tag":"single-player","text":"single-player progression through fifty levels of physics-based challenges","tagZh":"单人","textZh":"单人进阶，闯关五十个基于物理的挑战关卡"}},"0004f4fd-640f-409a-8a5e-b7c6963eeddf":{"subject":{"tag":"brain-teaser collection","text":"a variety of objects including fruits like strawberries and watermelons, a sleeping bat, fires, toy boxes, and text-based riddles","tagZh":"脑筋急转弯合集","textZh":"各种各样的物品，包括草莓和西瓜等水果、一只沉睡的蝙蝠、火焰、玩具箱以及文字谜题"},"gameplay":{"tag":"lateral thinking puzzle","text":"solve a series of 20 unconventional puzzles and trivia questions that require lateral thinking, such as dragging UI text elements, interacting with background elements, or waiting without input to progress","tagZh":"发散思维解谜","textZh":"解开一系列20道需要发散思维的非常规谜题和冷知识问答，例如拖动UI文字元素、与背景元素互动，或不作任何操作耐心等待以推进"},"artStyle":{"tag":"playful minimalist","text":"vibrant and clean flat-vector style with a soft cream background, utilizing bold typography, rounded UI elements, and expressive character assets","tagZh":"俏皮极简","textZh":"鲜明干净的扁平矢量风格，配以柔和的奶油色背景，运用粗体排版、圆角UI元素和富有表现力的角色素材"},"mood":{"tag":"silly and witty","text":"lighthearted and humorous tone that subverts player expectations with clever solutions and meme-inspired feedback","tagZh":"搞怪机智","textZh":"轻松幽默的基调，用巧妙的解法和梗味十足的反馈颠覆玩家的预期"},"interaction":{"tag":"multi-modal touch","text":"drag and drop interaction for object merging and placement, precision clicking on specific text or hidden objects, and intentional inactivity","tagZh":"多模态触控","textZh":"通过拖放进行物品合并与放置，精准点击特定文字或隐藏物品，以及有意为之的不操作"},"social":{"tag":"single-player","text":"single-player experience focused on individual problem-solving and personal IQ score calculation","tagZh":"单人","textZh":"专注于个人解题与IQ分数计算的单人体验"}},"013fbda4-d465-4e2c-a9b9-9be0eb4c02d3":{"subject":{"tag":"pathogen outbreak","text":"a biological containment zone where a global population is represented by healthy, infected, and cured cells.","tagZh":"病原体爆发","textZh":"一个生物防控区，其中全球人口由健康、感染和治愈的细胞来表示。"},"gameplay":{"tag":"cellular automata simulation","text":"interactive cellular automata sandbox where the user toggles between virus and cure tools to influence a spreading outbreak; features real-time population statistics and infection probability mechanics.","tagZh":"元胞自动机模拟","textZh":"交互式元胞自动机沙盒，用户可在病毒工具和治愈工具之间切换以影响蔓延中的疫情；具备实时人口统计和感染概率机制。"},"artStyle":{"tag":"cybernetic medical interface","text":"minimalist high-contrast grid visuals with a dark slate background, neon green and cyan accents, and a glass-morphism tactical UI.","tagZh":"赛博医疗界面","textZh":"极简高对比度的网格视觉，配以深板岩灰背景、霓虹绿与青色点缀，以及玻璃拟态的战术UI。"},"mood":{"tag":"tense clinical","text":"tense and clinical, emphasizing the urgency of an escalating outbreak through pulsating UI elements and scientific aesthetic.","tagZh":"紧张冷峻","textZh":"紧张而冷峻，通过脉动的UI元素和科学化的美学，凸显疫情不断升级的紧迫感。"},"interaction":{"tag":"drag-to-paint","text":"drag and pointer-down inputs to paint biological agents onto a grid, with button-based tool switching and world reset.","tagZh":"拖动涂绘","textZh":"通过拖动和按下指针在网格上涂绘生物制剂，并可用按钮切换工具和重置世界。"},"social":{"tag":"single-player","text":"single-player local simulation with no networked or competitive features.","tagZh":"单人","textZh":"单人本地模拟，无联网或竞技功能。"}},"b2bbcd0f-32e5-44ac-ad51-82c7e12168e9":{"subject":{"tag":"physics materials playground","text":"a collection of dynamic physical entities including simulated cloth, a rubber balloon, particle-based sand, a jelly cube, and orbital celestial bodies in a 3D stage environment.","tagZh":"物理材质游乐场","textZh":"一组动态物理实体，包括模拟布料、橡胶气球、粒子沙、果冻方块，以及3D舞台环境中的轨道天体。"},"gameplay":{"tag":"physics simulation sandbox","text":"interactive exploration of physics mechanics; users can drop cloths with adjustable fabric properties, hold buttons to inflate or deflate a balloon until it pops, observe gravity-defying sand particles, and drop rigid bodies into a reactive sand pit; includes a gallery of distinct simulation scenes.","tagZh":"物理模拟沙盒","textZh":"对物理机制的交互式探索；用户可以投放具有可调面料属性的布料、按住按钮为气球充气或放气直至爆裂、观察违反重力的沙粒，并将刚体投入会作出反应的沙坑；包含多个不同模拟场景的画廊。"},"artStyle":{"tag":"3D minimalist simulation","text":"clean 3D rendering using Three.js with soft lighting, smooth materials, and high-contrast color palettes; featuring instanced meshes for large-scale particle effects and high-fidelity physics deformations.","tagZh":"3D极简模拟","textZh":"使用Three.js的干净3D渲染，配以柔和光照、平滑材质和高对比度配色；采用实例化网格实现大规模粒子效果和高保真物理形变。"},"mood":{"tag":"satisfying and experimental","text":"calm, curious, and tactile; emphasizes the satisfying visual and auditory feedback of materials reacting to physical forces.","tagZh":"解压且富有实验性","textZh":"平静、好奇且有触感；强调材质在物理作用力下反应所带来的解压视听反馈。"},"interaction":{"tag":"multi-input sandbox controls","text":"long press to inflate/deflate, button clicks to drop objects or reset scenes, and numeric/color inputs to customize material parameters.","tagZh":"多输入沙盒操控","textZh":"长按充气/放气，点击按钮投放物体或重置场景，并通过数值/颜色输入自定义材质参数。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01875a36-3ac3-48b4-86a5-0bb4b6ec9cce":{"subject":{"tag":"wasteland bus rampage","text":"A monstrous bus driving through a post-apocalyptic wasteland, encountering human targets and cubicle obstacles.","tagZh":"废土巴士狂暴冲撞","textZh":"一辆巨兽般的巴士穿行于末日废土之中，遭遇人形目标和隔间障碍物。"},"gameplay":{"tag":"endless driving rampage","text":"Endless vertical-scrolling arcade driver where the player steers to collide with obstacles for points; features a speed-boosting nitro mechanic and screen-shake feedback on hits.","tagZh":"无尽驾驶狂暴","textZh":"无尽纵向滚屏的街机驾驶游戏，玩家操控车辆撞击障碍物得分；具备提速的氮气加速机制以及撞击时的屏幕震动反馈。"},"artStyle":{"tag":"gritty industrial retro","text":"Dark industrial aesthetic with wasteland backgrounds, scanline overlays, and vibrant particle effects; utilizes a mono-font UI with high-contrast yellow and orange accents.","tagZh":"粗粝工业复古","textZh":"阴暗的工业美学，配以废土背景、扫描线叠加和鲜艳的粒子效果；采用等宽字体UI，搭配高对比度的黄色与橙色点缀。"},"mood":{"tag":"intense chaotic","text":"Intense and aggressive, driven by heavy metal background music, explosive sound effects, and rapid screen-shake motion.","tagZh":"激烈混乱","textZh":"激烈而具攻击性，由重金属背景音乐、爆炸音效和快速的屏幕震动所驱动。"},"interaction":{"tag":"drag and tap","text":"Pointer drag for horizontal steering and tapping/clicking to activate a temporary nitro speed boost.","tagZh":"拖动与点击","textZh":"拖动指针进行左右转向，点击/轻触激活短暂的氮气加速。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"00adf086-9588-48fd-9b08-37809e943b38":{"subject":{"tag":"stickman physics sandbox","text":"animated stickman characters inhabiting a textured paper-style world reactive to elemental and physical forces.","tagZh":"火柴人物理沙盒","textZh":"动画火柴人角色栖身于富有质感的纸张风格世界中，可对元素力量与物理力量作出反应。"},"gameplay":{"tag":"interactive sandbox","text":"physics-driven sandbox simulation where players use elemental powers like gravity, lightning, and freezing to manipulate or eliminate crowds of stickmen; includes spawning controls and state-altering mechanics like gold transformation.","tagZh":"交互式沙盒","textZh":"物理驱动的沙盒模拟，玩家使用重力、闪电、冰冻等元素力量来摆布或消灭成群的火柴人；包含生成控制以及点化成金等状态改变机制。"},"artStyle":{"tag":"doodle paper aesthetic","text":"sketch-style stickman animations on a paper texture background, featuring dynamic particle effects, screen shake, and color-shifting filters for elemental status effects.","tagZh":"涂鸦纸张美学","textZh":"在纸张质感背景上呈现速写风格的火柴人动画，具备动态粒子效果、屏幕震动，以及用于表现元素状态效果的变色滤镜。"},"mood":{"tag":"chaotic and satisfying","text":"playfully chaotic and satisfying, emphasizing physics experimentation and visual feedback through sound effects and rapid movement.","tagZh":"混乱且解压","textZh":"俏皮混乱又解压，通过音效和快速运动强调物理实验和视觉反馈。"},"interaction":{"tag":"pointer-based power selection","text":"pointer-down and drag interactions to apply selected powers, with button controls for spawning and power switching.","tagZh":"基于指针的能力选择","textZh":"通过按下指针和拖动来施加所选能力，并用按钮控制生成和能力切换。"},"social":{"tag":"single-player","text":"single-player experience focused on local physics interaction and sandbox experimentation.","tagZh":"单人","textZh":"专注于本地物理互动与沙盒实验的单人体验。"}},"0056aaf9-18cd-4707-acef-121ab1c16155":{"subject":{"tag":"insult and comeback generator","text":"a collection of character personas including family members, exes, and bosses in a modern roast-themed interface","tagZh":"毒舌回击生成器","textZh":"在现代吐槽主题界面中呈现的一组角色人设，包括家人、前任和老板"},"gameplay":{"tag":"persona-based text generator","text":"select a target persona and input an insult to generate a tailored witty comeback; incremental creative utility focused on social banter","tagZh":"基于人设的文本生成器","textZh":"选择一个目标人设并输入一句挖苦，即可生成量身定制的机智回击；专注于社交斗嘴的渐进式创意工具"},"artStyle":{"tag":"neo-brutalist pop art","text":"high-contrast bold black borders, heavy drop shadows, vibrant pastel backgrounds, and a punchy comic-book aesthetic","tagZh":"新粗野主义波普艺术","textZh":"高对比度的粗黑边框、厚重的投影、鲜艳的柔和色背景，以及冲击力十足的漫画书美学"},"mood":{"tag":"silly and witty","text":"cheeky, confident, and lighthearted, focused on savage social humor and sharp-witted responses","tagZh":"搞怪机智","textZh":"俏皮、自信又轻松，专注于犀利的社交幽默和一针见血的机智回应"},"interaction":{"tag":"text entry and selection","text":"typing text into a multiline input field, horizontal scroll selection for characters, and button clicks for generation and clipboard copying","tagZh":"文本输入与选择","textZh":"在多行输入框中键入文字，横向滚动选择角色，并点击按钮进行生成和复制到剪贴板"},"social":{"tag":"single-player","text":"single-player experience with local clipboard sharing for social use outside the application","tagZh":"单人","textZh":"单人体验，可通过本地剪贴板分享，供在应用之外的社交场合使用"}},"0125f318-608d-4718-94f2-30f80b3baa4c":{"subject":{"tag":"neon gravity balls","text":"bouncing balls falling through a neon cyber-void onto user-drawn platforms.","tagZh":"霓虹重力球","textZh":"弹跳的小球穿过霓虹赛博虚空，落到用户绘制的平台上。"},"gameplay":{"tag":"drawing physics incremental","text":"draw lines to bounce falling balls for money; reach the bottom zone for bonus gold to purchase more balls and unlock aesthetic skins in a physics-based idle hybrid loop.","tagZh":"绘图物理放置","textZh":"画线弹开下落的小球以赚取金钱；小球到达底部区域可获得额外金币，用于购买更多小球并解锁外观皮肤，形成基于物理的放置混合循环。"},"artStyle":{"tag":"neon synthwave","text":"vibrant neon and synthwave aesthetic with high-contrast glowing lines, dark neutral backgrounds, and polished UI overlays.","tagZh":"霓虹合成波","textZh":"鲜艳的霓虹与合成波美学，配以高对比度的发光线条、深色中性背景和精致的UI叠层。"},"mood":{"tag":"satisfying arcade","text":"satisfying and rhythmic with synthwave background music and coin-collection sound effects.","tagZh":"解压街机","textZh":"解压且富有节奏感，配以合成波背景音乐和收集金币的音效。"},"interaction":{"tag":"drag drawing","text":"drag to draw temporary lines on a 2D canvas that interact with physics entities.","tagZh":"拖动绘制","textZh":"在2D画布上拖动绘制临时线条，与物理实体产生互动。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"016e7b19-d7e0-488b-a3cb-c332a9a326bb":{"subject":{"tag":"tactical survival arena","text":"a military-themed arena featuring soldiers in camouflage, pine trees, and a shrinking purple storm perimeter.","tagZh":"战术生存竞技场","textZh":"一个军事主题的竞技场，包含身着迷彩的士兵、松树，以及不断缩小的紫色风暴边界。"},"gameplay":{"tag":"mini battle royale","text":"top-down survival with twin-stick shooting, resource gathering from trees, and base building; eliminate enemies while staying inside a shrinking storm radius to be the last survivor.","tagZh":"迷你大逃杀","textZh":"俯视角生存玩法，融合双摇杆射击、伐树采集资源和基地建造；在不断缩小的风暴范围内消灭敌人并存活到最后。"},"artStyle":{"tag":"low-poly stylized 3D","text":"vibrant low-poly 3D graphics with blocky character models, camouflage textures, and a clean flat-shaded environment with tactical UI elements.","tagZh":"低多边形风格化3D","textZh":"鲜艳的低多边形3D画面，配以方块状角色模型、迷彩贴图，以及干净的平面着色环境和战术UI元素。"},"mood":{"tag":"tense action","text":"intense and competitive survival atmosphere fueled by the pressure of a closing storm and tactical combat.","tagZh":"紧张动作","textZh":"激烈而具竞争性的生存氛围，由逼近的风暴压力和战术战斗所助推。"},"interaction":{"tag":"twin-stick building","text":"dual virtual joysticks for simultaneous movement and directional aiming, with a dedicated button for placing defensive walls.","tagZh":"双摇杆建造","textZh":"使用双虚拟摇杆同时进行移动和方向瞄准，并设有专用按钮放置防御墙。"},"social":{"tag":"single-player","text":"single-player session-based play against computer-controlled opponents.","tagZh":"单人","textZh":"以对局为单位、对抗电脑控制对手的单人玩法。"}},"00857c20-76cf-4d30-9c10-e96e7d0691bc":{"subject":{"tag":"summer glitch aesthetic","text":"a stylized watermelon pig themed summer scene featuring video content modified by real-time visual filters","tagZh":"夏日故障美学","textZh":"一个风格化的西瓜猪主题夏日场景，视频内容由实时视觉滤镜进行处理"},"gameplay":{"tag":"glitch art simulation","text":"interactive visual manipulation sandbox where the user adjusts distortion, saturation, hue shift, and contrast to modify a live video feed; sandbox art simulation","tagZh":"故障艺术模拟","textZh":"交互式视觉处理沙盒，用户可调整扭曲、饱和度、色相偏移和对比度来修改实时视频画面；沙盒式艺术模拟"},"artStyle":{"tag":"vibrant glitch art","text":"high-contrast glitch art with a rose and emerald palette, featuring SVG turbulence displacement effects and a modern dark-mode UI with translucent overlays","tagZh":"鲜艳故障艺术","textZh":"高对比度的故障艺术，配以玫红与翡翠绿配色，采用SVG湍流置换效果，以及带半透明叠层的现代深色模式UI"},"mood":{"tag":"creative summer vibes","text":"playful and creative with a summer vibe, combining relaxing video loops with high-energy visual distortion feedback","tagZh":"创意夏日氛围","textZh":"俏皮又富有创意，洋溢夏日气息，将放松的循环视频与高能量的视觉扭曲反馈相结合"},"interaction":{"tag":"touch slider control","text":"touch and drag interactions via custom sliders to control video filters, with button toggles to fold or expand the control panel","tagZh":"触控滑块操控","textZh":"通过自定义滑块进行触摸和拖动来控制视频滤镜，并用按钮切换折叠或展开控制面板"},"social":{"tag":"single-player","text":"single-player experience focused on individual creative expression and visual exploration","tagZh":"单人","textZh":"专注于个人创意表达与视觉探索的单人体验"}},"01d5961c-1f98-4f46-b991-ed60d4d501bb":{"subject":{"tag":"cosmic scale journey","text":"The entire known existence from the observable universe, superclusters, and galaxies down to subatomic particles including cells, DNA, quarks, and Planck strings.","tagZh":"宇宙尺度之旅","textZh":"整个已知的存在，从可观测宇宙、超星系团和星系，一直到细胞、DNA、夸克和普朗克弦等亚原子层面。"},"gameplay":{"tag":"educational zoom simulation","text":"Continuous zoom-based exploration through eighty-six distinct cosmic and subatomic scales; an interactive simulation of relative size and scientific order.","tagZh":"教育性缩放模拟","textZh":"以连续缩放的方式探索八十六个不同的宇宙与亚原子尺度；一个关于相对大小和科学量级的交互式模拟。"},"artStyle":{"tag":"minimalist celestial","text":"Clean educational aesthetic with high-contrast photographic assets against deep black space, featuring minimalist UI overlays and technical data labels.","tagZh":"极简天体","textZh":"干净的教育美学，在深黑太空背景下呈现高对比度的实拍素材，配以极简UI叠层和技术数据标签。"},"mood":{"tag":"awe-inspiring ambient","text":"Awe-inspiring and contemplative with soothing ambient background music and a sense of scientific wonder.","tagZh":"震撼氛围","textZh":"震撼而引人深思，配以舒缓的氛围背景音乐和对科学的惊叹之感。"},"interaction":{"tag":"vertical drag zoom","text":"Vertical drag to control zoom level with haptic vibration and sound effect feedback as the user crosses scale thresholds.","tagZh":"垂直拖动缩放","textZh":"垂直拖动控制缩放级别，当用户跨越尺度阈值时提供触觉振动和音效反馈。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"0212e006-b861-4bb5-95af-c4f4b2e69471":{"subject":{"tag":"rainbow spring toy","text":"a multi-segmented kinetic rainbow spring toy consisting of eighty interconnected rings.","tagZh":"彩虹弹簧玩具","textZh":"一个多段式的动态彩虹弹簧玩具，由八十个相互连接的圆环组成。"},"gameplay":{"tag":"physics sandbox","text":"interactive physics simulation where a lead ring follows the cursor while trailing rings exhibit lerp-based weight and tension behaviors; no scoring or win conditions.","tagZh":"物理沙盒","textZh":"交互式物理模拟，领头的圆环跟随光标，其后的圆环则呈现基于线性插值的重量与张力行为；无计分或胜利条件。"},"artStyle":{"tag":"neon rainbow minimalist","text":"minimalist dark aesthetic featuring a high-contrast black background and vibrant rainbow-gradient rings with glowing strokes and low-opacity halos.","tagZh":"霓虹彩虹极简","textZh":"极简的暗色美学，以高对比度的黑色背景搭配鲜艳的彩虹渐变圆环，配有发光描边和低透明度光晕。"},"mood":{"tag":"soothing hypnotic","text":"soothing and hypnotic experience with metallic, reactive audio tones that shift in frequency and gain based on movement velocity.","tagZh":"舒缓催眠","textZh":"舒缓而催眠的体验，配以金属质感的响应式音调，其频率和增益会随移动速度而变化。"},"interaction":{"tag":"drag and follow","text":"drag or touch to lead the spring; includes reactive audio feedback controlled by pointer velocity.","tagZh":"拖动跟随","textZh":"拖动或触摸来引领弹簧；包含由指针速度控制的响应式音频反馈。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"016e83af-2d11-4d71-9ca5-0c7e5f1d0cdf":{"subject":{"tag":"fast-food photography","text":"various food ingredients such as bacon, lettuce, jalapenos, and onion rings arranged in a meal-prep or dining setting","tagZh":"快餐摄影","textZh":"各种食材，如培根、生菜、墨西哥辣椒和洋葱圈，摆放在备餐或就餐的场景中"},"gameplay":{"tag":"spot the difference","text":"timed spot-the-difference puzzle requiring players to find ten hidden objects in a modified food image while avoiding time penalties for incorrect clicks","tagZh":"找不同","textZh":"限时找不同解谜，要求玩家在经过修改的食物图片中找出十处隐藏差异，同时避免因误点而受到时间惩罚"},"artStyle":{"tag":"clean photographic minimalist","text":"clean minimalist UI with realistic food photography and vibrant orange accents for interaction elements","tagZh":"干净写实极简","textZh":"干净极简的UI，配以逼真的食物摄影，并用鲜艳的橙色点缀交互元素"},"mood":{"tag":"intense culinary challenge","text":"intense and satisfying, with pressure added by a ticking timer and high-energy victory feedback","tagZh":"紧张美食挑战","textZh":"紧张又解压，由滴答倒计时增添压力，并配以高能量的胜利反馈"},"interaction":{"tag":"point and click","text":"click or tap interaction to identify visual differences, featuring immediate visual feedback and time-reduction penalties for errors","tagZh":"点击操作","textZh":"通过点击或轻触来识别视觉差异，具备即时视觉反馈，并对错误施以扣减时间的惩罚"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global leaderboard for the fastest completion times","tagZh":"异步竞赛","textZh":"异步竞赛，设有以最快完成时间排名的全球排行榜"}},"0643ee5e-fe29-43c0-b329-7d05c30b4e0c":{"subject":{"tag":"interactive physics cloth","text":"simulated silk and cotton fabrics draping over glass spheres within a dark void.","tagZh":"交互式物理布料","textZh":"在暗色虚空中，模拟的丝绸和棉布垂覆在玻璃球体上。"},"gameplay":{"tag":"physics simulation toy","text":"an interactive sandbox simulation where players adjust material properties and mesh resolution to observe real-time cloth physics, gravity, and collision.","tagZh":"物理模拟玩具","textZh":"一个交互式沙盒模拟，玩家可调整材质属性和网格精度，以观察实时的布料物理、重力和碰撞。"},"artStyle":{"tag":"3D minimalist tech","text":"high-fidelity 3D rendering with physical materials, featuring a high-contrast palette of pink silk and slate-blue environments.","tagZh":"3D极简科技","textZh":"采用物理材质的高保真3D渲染，配以粉色丝绸与板岩蓝环境的高对比度配色。"},"mood":{"tag":"zen satisfying","text":"calm, soothing, and tactile, focused on the satisfying visual flow of fabric movement and ambient zen music.","tagZh":"禅意解压","textZh":"平静、舒缓且富有触感，专注于布料运动那令人解压的视觉流动感和禅意氛围音乐。"},"interaction":{"tag":"parameter adjustment","text":"typing numeric values for mesh resolution, clicking buttons to toggle material types, and triggering a physics reset for repeated observation.","tagZh":"参数调节","textZh":"键入数值设定网格精度，点击按钮切换材质类型，并触发物理重置以便反复观察。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"00014872-ed2f-4452-9d88-fbc0ce0a4241":{"subject":{"tag":"dark void explorer","text":"a square character navigating silhouettes and floating blocks within a dark, atmospheric void filled with spores and glowing particles","tagZh":"暗黑虚空探索者","textZh":"一个方块角色在充满孢子和发光粒子的黑暗氛围虚空中，穿行于剪影与漂浮方块之间"},"gameplay":{"tag":"bridge building arcade","text":"precision timing loop where the user holds to grow a vertical bridge and releases to drop it across gaps; success leads to progression across shifting blocks while failure results in falling","tagZh":"搭桥街机","textZh":"精准计时循环玩法：长按令竖桥变长，松手将其放倒以跨越沟壑；成功可在移动方块间前进，失败则坠落"},"artStyle":{"tag":"dark aesthetic synthwave","text":"high-contrast minimalist style with a deep purple and blood-red gradient background, silhouette platforms, glowing neon accents, and particle effects","tagZh":"暗黑合成波美学","textZh":"高对比度极简风格，深紫与血红渐变背景，剪影平台、发光霓虹点缀及粒子特效"},"mood":{"tag":"tense and eerie","text":"tense and atmospheric with a sense of isolation, featuring square-wave audio cues and a pulsating dark aesthetic","tagZh":"紧张诡异","textZh":"紧张而富氛围感，带有孤寂气息，配以方波音效提示和律动的暗黑美学"},"interaction":{"tag":"long press timing","text":"long press and release to control bridge length, with button clicks for menu navigation","tagZh":"长按计时","textZh":"长按并松手控制桥的长度，通过点击按钮进行菜单导航"},"social":{"tag":"single-player","text":"single-player experience with local high score tracking","tagZh":"单人游戏","textZh":"单人体验，带有本地最高分记录"}},"01889f37-9d7d-4839-a72c-bbc21b8106df":{"subject":{"tag":"interactive fluid dynamics","text":"a digital canvas featuring various physical materials including water, slime, paint, lava, and sand that respond to touch and environmental variables.","tagZh":"交互式流体动力学","textZh":"一块数字画布，包含水、黏液、颜料、熔岩和沙等多种物理材质，可响应触摸和环境变量。"},"gameplay":{"tag":"fluid simulation sandbox","text":"a physics-based sandbox where users manipulate fluid flows through splat mechanics, symmetry rays, and adjustable simulation properties like velocity decay and pressure.","tagZh":"流体模拟沙盒","textZh":"基于物理的沙盒，用户可通过泼溅机制、对称射线以及速度衰减、压力等可调模拟参数来操控流体流动。"},"artStyle":{"tag":"neon digital art","text":"high-contrast neon aesthetics with custom post-processing effects including RGB glitch, 8-bit pixelation, VHS grain, and glowing kaleidoscope symmetry.","tagZh":"霓虹数字艺术","textZh":"高对比度霓虹美学，配以自定义后期特效，包括RGB故障、8位像素化、VHS噪点和发光的万花筒对称效果。"},"mood":{"tag":"mesmerizing and relaxing","text":"soothing and satisfying, driven by ambient audio and the hypnotic motion of flowing colors and artistic exploration.","tagZh":"迷人放松","textZh":"舒缓而解压，由环境音效以及流动色彩的催眠般律动和艺术探索所驱动。"},"interaction":{"tag":"multitouch fluid control","text":"pointer-based dragging and clicking to interact with the fluid, with UI controls for material switching and real-time physics tweaking.","tagZh":"多点触控流体操控","textZh":"通过指针拖拽和点击与流体互动，并配有UI控件用于切换材质和实时调整物理参数。"},"social":{"tag":"single-player","text":"single-player creative tool for generative art and physics exploration.","tagZh":"单人游戏","textZh":"用于生成艺术和物理探索的单人创作工具。"}},"00a476e3-970b-49d1-8bfe-042e3c9eab31":{"subject":{"tag":"celestial and physical phenomena","text":"astronomical bodies including a sun and moon, fluid particles, magnetized grids, multi-segment pendulums, and bouncing balls in a circular cage.","tagZh":"天体与物理现象","textZh":"包含太阳和月亮等天体、流体粒子、磁化网格、多段摆以及圆形笼中弹跳的小球。"},"gameplay":{"tag":"physics-based sandbox","text":"explorative sandbox with five simulation modes: solar eclipse alignment, fluid vorticity flow, interactive magnetic field manipulation, multi-segment verlet integration pendulums, and musical physics bounce; no specific win conditions, focusing on satisfying tactile feedback and physical behavior.","tagZh":"基于物理的沙盒","textZh":"探索型沙盒，含五种模拟模式：日食对齐、流体涡度流动、交互式磁场操控、多段Verlet积分摆以及音乐物理弹跳；无特定胜利条件，专注于令人满足的触觉反馈和物理表现。"},"artStyle":{"tag":"minimalist neon digital","text":"clean minimalist aesthetic with high-contrast neon accents against deep black and dark blue backgrounds, utilizing canvas-rendered particles, vector lines, and glowing glow-effect UI elements.","tagZh":"极简霓虹数字","textZh":"简洁极简美学，在深黑与深蓝背景上以高对比度霓虹点缀，运用画布渲染的粒子、矢量线条和发光的UI元素。"},"mood":{"tag":"soothing and hypnotic","text":"calm, atmospheric, and meditative tone supported by space ambient music and harmonious audio feedback from physics collisions.","tagZh":"舒缓催眠","textZh":"平静、富氛围感且冥想式的基调，辅以太空氛围音乐和物理碰撞带来的和谐音效反馈。"},"interaction":{"tag":"multi-touch manipulation","text":"drag and pointer-based manipulation to align celestial bodies, attract/repel particles, or swing pendulums, with button controls for switching simulation modes and parameters.","tagZh":"多点触控操作","textZh":"通过拖拽和指针操作对齐天体、吸引/排斥粒子或摆动摆锤，并配有按钮控件用于切换模拟模式和参数。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"00efb9dd-ee08-4d7b-a864-ba26ad5c7644":{"subject":{"tag":"colorful squad-based survival","text":"forty sphere-shaped characters representing ten colored squads competing on a floating hexagonal tile arena","tagZh":"多彩小队生存","textZh":"四十个球形角色代表十支彩色小队，在漂浮的六边形砖块竞技场上比拼"},"gameplay":{"tag":"battle royale survival","text":"arcade survival through four rounds of elimination; players must stay on a shrinking platform while tiles fall away and other players bounce into them; features physical collision and squad-based elimination.","tagZh":"大逃杀生存","textZh":"经历四轮淘汰的街机生存玩法；玩家须在不断缩小的平台上坚守，同时砖块塌落、其他玩家撞来；含物理碰撞和小队淘汰机制。"},"artStyle":{"tag":"vibrant 3D low-poly","text":"3D stylized aesthetic with vibrant solid colors, glowing neon-adjacent UI, and a bright sky-blue environment using smooth sphere and cylinder geometries.","tagZh":"鲜艳3D低多边形","textZh":"3D风格化美学，配以鲜艳纯色、近霓虹发光的UI以及明亮的天蓝色环境，采用平滑的球体和圆柱几何体。"},"mood":{"tag":"high-energy competitive","text":"tense and cheerful with a chaotic battle-royale ries drivers, teams, and legendary racers","tagZh":"职业改装房车赛","textZh":"一个多系列改装房车赛世界，包含Cup、Xfinity和Truck系列的车手、车队及传奇赛车手"},"gameplay":{"tag":"racing management simulator","text":"manage a racing team or a driver career through season-long race simulations, training stats, car maintenance, contract negotiations, and financial management to win championships and reach the Hall of Fame","tagZh":"赛车经营模拟","textZh":"通过整赛季比赛模拟、训练属性、赛车维护、合同谈判和财务管理来经营车队或车手生涯，以赢得冠军并入选名人堂"},"artStyle":{"tag":"modern dark sports dashboard","text":"a sleek, dark-themed sports interface with high-contrast text, color-coded driver numbers, Lucide iconography, and reactive progress bars for race simulations","tagZh":"现代暗黑运动仪表盘","textZh":"简洁的暗色运动界面，配以高对比度文字、按颜色区分的车手号码、Lucide图标以及用于比赛模拟的动态进度条"},"mood":{"tag":"intense competitive","text":"competitive and high-stakes, capturing the pressure of playoff elimination, offseason rumors, and the glory of championship ceremonies","tagZh":"激烈竞技","textZh":"竞争激烈且高风险，捕捉季后赛淘汰的压力、休赛期的流言以及夺冠典礼的荣耀"},"interaction":{"tag":"menu-driven strategy","text":"click and button-based navigation through dashboards, management tabs, and simulation controls, including text-based roster editing and cloud saving","tagZh":"菜单驱动策略","textZh":"通过点击和按钮在仪表盘、管理标签页和模拟控件间导航，包括基于文本的阵容编辑和云端存档"},"social":{"tag":"asynchronous collaboration","text":"asynchronous collaboration through community roster sharing, allowing players to upload custom driver sets and download shared rosters from other users","tagZh":"异步协作","textZh":"通过社区阵容分享实现异步协作，玩家可上传自定义车手组合并下载其他用户分享的阵容"}},"01fac1b5-8956-498a-849c-a8207f34cf62":{"subject":{"tag":"kinetic ring simulation","text":"glowing colored balls within concentric rotating rings featuring escape gaps","tagZh":"动感圆环模拟","textZh":"发光的彩色小球置于带有逃逸缺口的同心旋转圆环之中"},"gameplay":{"tag":"physics sandbox","text":"simulated physics playground where balls bounce off rotating rings, triggering growth or multiplication effects upon impact, with a lose condition when the container overflows ion of a rising irritation meter","tagZh":"惬意又紧张","textZh":"舒缓惬意的氛围，辅以呼噜声和轻松音乐，与烦躁值上升带来的紧张感形成反差"},"interaction":{"tag":"pointer hold and release","text":"pointer down to interact and pointer up to release; features haptic vibration feedback during interaction and on failure","tagZh":"指针长按松开","textZh":"按下指针进行互动、抬起松开；互动过程中和失败时均带有触觉振动反馈"},"social":{"tag":"single-player","text":"single-player experience with a persistent personal best duration score","tagZh":"单人游戏","textZh":"单人体验，带有持久保存的个人最长时长记录"}},"01f9e0a9-46c8-4e28-a877-8b5e95ceb20e":{"subject":{"tag":"fluid simulation","text":"dynamic fluid simulation with swirling dye and luminous smoke-like particles on a black void","tagZh":"流体模拟","textZh":"动态流体模拟，在黑色虚空中呈现旋转的染料和发光的烟雾状粒子"},"gameplay":{"tag":"creative sandbox","text":"interactive fluid physics sandbox where user swipes create colorful swirling patterns; includes screen-clearing and density dissipation mechanics","tagZh":"创意沙盒","textZh":"交互式流体物理沙盒，用户滑动即可创造多彩的旋涡图案；含清屏和密度消散机制"},"artStyle":{"tag":"neon bloom","text":"vibrant neon aesthetic with high-contrast bloom effects, fluid GPU-accelerated motion, and customizable color hues","tagZh":"霓虹泛光","textZh":"鲜艳的霓虹美学，配以高对比度泛光特效、GPU加速的流畅运动以及可自定义的色调"},"mood":{"tag":"relaxing satisfying","text":"soothing and meditative with satisfying visual feedback from tactile interactions","tagZh":"放松解压","textZh":"舒缓而冥想，触觉互动带来令人满足的视觉反馈"},"interaction":{"tag":"swipe and click","text":"swipe or click to generate fluid movement, with dedicated button for clearing the canvas","tagZh":"滑动与点击","textZh":"滑动或点击以生成流体运动，并设有专用按钮用于清空画布"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"00c9806f-9d7b-435a-8d4b-a0b3d8bdf8ff":{"subject":{"tag":"K-pop idols and stage","text":"K-pop inspired stage setting featuring song references and collectible character skins for groups like ILLIT, LE SSERAFIM, and NewJeans.","tagZh":"K-pop偶像与舞台","textZh":"K-pop风格的舞台场景，包含歌曲彩蛋以及ILLIT、LE SSERAFIM、NewJeans等团体的可收集角色皮肤。"},"gameplay":{"tag":"4-lane rhythm arcade","text":"4-lane scrolling rhythm game where players tap falling notes in time with music to earn high scores, maintain combos, and unlock new character skins and songs.","tagZh":"四轨音游街机","textZh":"四轨滚动音乐游戏，玩家随音乐节奏点击下落的音符以获取高分、保持连击，并解锁新的角色皮肤和歌曲。"},"artStyle":{"tag":"neon vibrant K-pop","text":"Vibrant neon-themed interface with customizable UI styles including stars, hearts, and bubbles; features dynamic backgrounds and rhythmic note animations.","tagZh":"鲜艳霓虹K-pop","textZh":"鲜艳的霓虹主题界面，可自定义UI风格，包括星星、爱心和气泡；含动态背景和富节奏感的音符动画。"},"mood":{"tag":"cheerful energetic","text":"Energetic and upbeat, driven by K-pop hits and satisfying visual feedback for successful hits and high combos.","tagZh":"欢快活力","textZh":"活力四射、节奏明快，由K-pop热门金曲驱动，成功打击和高连击均带来令人满足的视觉反馈。"},"interaction":{"tag":"tap and touch","text":"Multi-lane tap controls for rhythmic gameplay, with additional support for file uploads and camera access to set custom backgrounds.","tagZh":"点击与触摸","textZh":"多轨点击操作用于节奏玩法，并额外支持文件上传和相机访问以设置自定义背景。"},"social":{"tag":"single-player","text":"single-player game with local progression including high scores, character collection, and a skin unlock system.","tagZh":"单人游戏","textZh":"单人游戏，含本地进度，包括高分、角色收集和皮肤解锁系统。"}},"013e7068-e063-4b07-b357-d68a312eabfa":{"subject":{"tag":"pride flag coloring","text":"a traditional six-stripe pride flag and a palette of vibrant rainbow colors","tagZh":"骄傲旗填色","textZh":"一面传统的六条纹骄傲旗和一组鲜艳的彩虹配色"},"gameplay":{"tag":"interactive coloring puzzle","text":"select and apply colors to specific sections of a flag to match a predefined sequence; puzzle completion triggers a celebratory message.","tagZh":"交互式填色解谜","textZh":"选择并将颜色涂到旗帜的特定区域，以匹配预设的顺序；解谜完成时触发庆祝消息。"},"artStyle":{"tag":"clean minimalist","text":"modern minimalist design with bold solid colors, rounded UI elements, and high-contrast typography against a clean white background.","tagZh":"简洁极简","textZh":"现代极简设计，配以醒目的纯色、圆角UI元素以及在洁净白色背景上的高对比度排版。"},"mood":{"tag":"cheerful supportive","text":"cheerful and inclusive, featuring celebratory messaging and a positive, affirming tone.","tagZh":"欢快包容","textZh":"欢快而包容，含庆祝性文字，基调积极而肯定。"},"interaction":{"tag":"tap coloring","text":"click or tap to select colors from a palette and apply them to stripes on a canvas.","tagZh":"点击填色","textZh":"点击或轻触从调色板中选择颜色，并将其涂到画布上的条纹上。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"019b2bf8-e0da-45ce-975a-d5b39213429c":{"subject":{"tag":"summer beverage stand","text":"a sunny outdoor bar setting featuring a mason jar glass, fresh fruit like lemons, limes, and strawberries, ice cubes, mint, and decorative drink accessories like straws and umbrellas","tagZh":"夏日饮品摊","textZh":"阳光明媚的户外吧台场景，含梅森罐玻璃杯、柠檬、青柠、草莓等新鲜水果、冰块、薄荷以及吸管和小伞等装饰性饮品配件"},"gameplay":{"tag":"drink preparation simulation","text":"select and add ingredients to a glass to create summer drinks; includes a sandbox mode for creative play and an orders mode requiring specific recipes and liquid levels to satisfy customers","tagZh":"调饮模拟","textZh":"选择并向杯中添加原料以调制夏日饮品；含供自由创作的沙盒模式，以及需按特定配方和液位来满足顾客的订单模式"},"artStyle":{"tag":"vibrant cartoon","text":"cheerful and vibrant cartoon style with smooth animations, high-contrast tropical colors, and a clean UI featuring glass transparency and liquid mixing effects","tagZh":"鲜艳卡通","textZh":"欢快鲜艳的卡通风格，配以流畅动画、高对比度的热带色彩以及含玻璃透明和液体混合效果的简洁UI"},"mood":{"tag":"relaxing summer vibes","text":"relaxing, satisfying, and cheerful with upbeat acoustic background music and crisp sound effects for pouring, squeezing, and ice clinking","tagZh":"放松夏日氛围","textZh":"放松、解压又欢快，配以轻快的原声背景音乐以及倒水、挤压和冰块碰撞的清脆音效"},"interaction":{"tag":"tap-to-pour controls","text":"click or tap interactions to select tools and add ingredients, with button-based controls for resetting and serving drinks","tagZh":"点击倒饮操作","textZh":"通过点击或轻触交互来选择工具和添加原料，并以按钮控件重置和上饮"},"social":{"tag":"single-player","text":"single-player experience focused on personal creativity and individual task completion without online competition","tagZh":"单人游戏","textZh":"专注于个人创意和独立任务完成的单人体验，无在线竞技"}},"001c9de8-89ca-446d-aacc-ddebe48bfea3":{"subject":{"tag":"anime block tower","text":"A growing tower of colorful pastel blocks set against a soft sky-blue and pink gradient background.","tagZh":"动漫方块塔","textZh":"一座由五彩粉彩方块堆叠而成、不断增高的塔，背景是柔和的天蓝与粉红渐变。"},"gameplay":{"tag":"arcade stacker","text":"Precision timing arcade game where players stack moving blocks to build a tower; pieces are sliced off if misaligned, reducing the platform size until no surface remains.","tagZh":"街机堆叠","textZh":"考验精准时机的街机游戏，玩家堆叠移动的方块以搭建高塔；未对齐的部分会被切掉，使平台逐渐变小，直到没有落脚之处。"},"artStyle":{"tag":"anime pastel 3D","text":"3D toon-shaded blocks with thick black outlines, featuring a vibrant pastel palette and high-contrast UI elements inspired by anime aesthetics.","tagZh":"动漫粉彩3D","textZh":"采用卡通渲染的3D方块，配有粗黑描边，色彩为鲜明的粉彩色调，并有受动漫美学启发的高对比度UI元素。"},"mood":{"tag":"cheerful and satisfying","text":"Cheerful and satisfying, with a sense of rhythm from perfect timing and lighthearted background music.","tagZh":"欢快解压","textZh":"欢快而令人满足，完美时机带来节奏感，搭配轻松愉悦的背景音乐。"},"interaction":{"tag":"tap timing","text":"Single-tap or click timing to drop moving blocks onto the tower; simple one-touch gameplay.","tagZh":"点击掌握时机","textZh":"通过单次点击或鼠标点击把握时机，将移动的方块落到塔上；简单的单点操作玩法。"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global leaderboard titled anime_stack_leaderboard_v3 where players compare high scores.","tagZh":"异步竞技","textZh":"异步竞技，设有名为 anime_stack_leaderboard_v3 的全球排行榜，玩家可比拼最高分。"}},"01121612-7e12-458c-addb-834864a62d7b":{"subject":{"tag":"evolving grey goo","text":"A grey goo entity evolving from microscopic cells and DNA to insects, sea creatures, city buildings, and cosmic planets across five distinct stages.","tagZh":"进化的灰色黏体","textZh":"一个灰色黏体实体，历经五个不同阶段，从微观细胞和DNA进化为昆虫、海洋生物、城市建筑，直至宇宙星球。"},"gameplay":{"tag":"growth arcade","text":"Arcade growth loop where the player consumes smaller entities to increase their scale and advance through size-based stage thresholds while avoiding larger predators; includes a final big bang reset.","tagZh":"成长街机","textZh":"街机式成长循环，玩家吞噬更小的实体来增大体型，跨越基于大小的阶段门槛，同时躲避更大的捕食者；最终以一次大爆炸重置。"},"artStyle":{"tag":"emoji-based minimalist","text":"Minimalist canvas rendering using emojis for all entities and the player avatar, set against color-coded grid backgrounds that change per stage.","tagZh":"emoji极简风","textZh":"极简的画布渲染，所有实体和玩家角色均用emoji表示，背景为随阶段变换的彩色编码网格。"},"mood":{"tag":"addictive progression","text":"Satisfying and addictive, moving from a tense survival feel at small scales to a powerful sense of scale, accompanied by synthesized sound effects and TTS feedback.","tagZh":"令人上瘾的进阶","textZh":"令人满足且上瘾，从小体型时的紧张求生感过渡到宏大的尺度感，并配有合成音效和TTS语音反馈。"},"interaction":{"tag":"drag-to-move","text":"Drag and pointer-based movement to steer the player toward targets, with menu buttons for 'Hack Mod' cheats and avatar selection.","tagZh":"拖动移动","textZh":"通过拖动和指针操控角色朝目标移动，菜单按钮可开启'Hack Mod'作弊功能和选择角色。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"0014f9e4-3d31-49ce-b17a-a4234d82a2c6":{"subject":{"tag":"celestial egg universe","text":"a cosmic setting featuring celestial bodies including the sun, various planets of the solar system, moons, and stars contained within surprise eggs","tagZh":"天体扭蛋宇宙","textZh":"一个宇宙场景，太阳、太阳系各大行星、卫星和恒星等天体都藏在惊喜扭蛋之中。"},"gameplay":{"tag":"clicker gacha collection","text":"tap to open mystery eggs and reveal celestial bodies; earn currency through clicking to purchase and collect a full set of solar system entities in a shop-based progression system","tagZh":"点击扭蛋收集","textZh":"点击打开神秘扭蛋以揭晓天体；通过点击赚取货币，在基于商店的进阶系统中购买并集齐整套太阳系天体。"},"artStyle":{"tag":"vibrant cosmic minimalism","text":"minimalist flat design with vibrant radial gradients, glowing particle effects, and emoji icons set against deep space-themed backdrops","tagZh":"鲜艳宇宙极简","textZh":"极简扁平设计，配有鲜艳的径向渐变、发光粒子特效和emoji图标，背景为深邃的太空主题。"},"mood":{"tag":"soothing wonder","text":"relaxing and full of wonder, utilizing twinkling star animations, soft glowing visuals, and satisfying tactile feedback from clicking","tagZh":"舒缓的惊奇","textZh":"轻松而充满奇妙感，运用闪烁的星星动画、柔和的发光画面，以及点击时令人满足的触感反馈。"},"interaction":{"tag":"tap interaction","text":"simple click or tap input to open eggs, collect coins, navigate menus, and operate the celestial store","tagZh":"点击互动","textZh":"通过简单的点击或轻触来开蛋、收集金币、浏览菜单以及操作天体商店。"},"social":{"tag":"single-player","text":"single-player experience focused on personal collection and progression without networked or multiplayer features","tagZh":"单人游戏","textZh":"单人游戏体验，专注于个人收集与进阶，没有联网或多人功能。"}},"00cb2b35-1f3c-40fe-bee6-d35c7e585cf3":{"subject":{"tag":"voxel world","text":"a floating island composed of cubes representing natural elements like grass, dirt, stone, sand, wood, and leaves.","tagZh":"体素世界","textZh":"一座由方块组成的漂浮岛屿，方块代表草地、泥土、石头、沙子、木头和树叶等自然元素。"},"gameplay":{"tag":"creative voxel sandbox","text":"creative building and destruction simulation where players place blocks to expand a voxel environment or remove existing ones; features block type selection and a reset function.","tagZh":"创意体素沙盒","textZh":"创意搭建与破坏模拟，玩家放置方块以扩展体素环境或移除已有方块；具有方块类型选择和重置功能。"},"artStyle":{"tag":"low-poly 3D","text":"stylized 3D voxel art with a clean, high-contrast color palette, sky-blue background, and slightly spaced grid-like cube layout.","tagZh":"低多边形3D","textZh":"风格化的3D体素美术，色彩干净且高对比，天蓝色背景，方块以略带间距的网格状排布。"},"mood":{"tag":"peaceful creative","text":"relaxing and creative atmosphere with soothing background music and tactile sound effects for placing and breaking blocks.","tagZh":"宁静创意","textZh":"轻松而富有创意的氛围，配有舒缓的背景音乐，以及放置和破坏方块时的触感音效。"},"interaction":{"tag":"tap and drag","text":"drag to orbit the 3D camera and tap blocks to place or destroy; includes UI buttons for mode switching and block selection.","tagZh":"点击与拖动","textZh":"拖动可环绕旋转3D镜头，点击方块可放置或破坏；含有用于切换模式和选择方块的UI按钮。"},"social":{"tag":"single-player","text":"single-player offline sandbox experience with no networked interaction or leaderboard.","tagZh":"单人游戏","textZh":"单人离线沙盒体验，没有联网互动或排行榜。"}},"002d8c51-a6c8-4dc4-bdcc-1d3187d72a8e":{"subject":{"tag":"community-reveal image","text":"A hidden mystery image covered by a dark grid of tiles, awaiting discovery through collective community participation.","tagZh":"社区揭晓图像","textZh":"一张被深色瓦片网格覆盖的隐藏神秘图像，等待通过社区集体参与来揭开。"},"gameplay":{"tag":"asynchronous collaborative reveal","text":"A community-driven progression loop where global interactions incrementally remove grid tiles to reveal a hidden background image; features a live progress bar tracking total engagement toward a final goal.","tagZh":"异步协作揭晓","textZh":"由社区驱动的进阶循环，全球玩家的互动会逐步移除网格瓦片以揭示隐藏的背景图像；设有实时进度条追踪朝向最终目标的整体参与度。"},"artStyle":{"tag":"minimalist dark ui","text":"Minimalist digital interface with a dark background, white typography, and a bright blue progress bar over a high-contrast grid.","tagZh":"极简深色UI","textZh":"极简的数字界面，深色背景、白色文字，以及覆盖在高对比网格上的亮蓝色进度条。"},"mood":{"tag":"curious collaborative","text":"Curious and communal, fostering a sense of shared anticipation as the crowd works together to uncover a secret.","tagZh":"好奇协作","textZh":"充满好奇与集体感，营造出众人齐心揭开秘密时的共同期待。"},"interaction":{"tag":"collective engagement","text":"Asynchronous interaction where individual user likes contribute to a global server-side counter that updates the game state in real-time.","tagZh":"集体参与","textZh":"异步互动，每位用户的点赞都会累加到服务器端的全局计数器，从而实时更新游戏状态。"},"social":{"tag":"asynchronous collaboration","text":"asynchronous collaboration; utilizes a global state counter mutation and query to synchronize progress across all players towards a shared reveal goal.","tagZh":"异步协作","textZh":"异步协作；利用全局状态计数器的更新与查询，在所有玩家之间同步进度，共同朝着揭晓目标迈进。"}},"008db4f9-1c32-4b44-9e83-72dba1155e70":{"subject":{"tag":"Tokyo-inspired city drifting","text":"a Tokyo-inspired urban landscape with Sakura trees, modern buildings, and a Panda AE86 car drifting on a custom-built road network.","tagZh":"东京风城市漂移","textZh":"一幅东京风格的都市景观，有樱花树、现代建筑，以及一辆熊猫配色的AE86在自建道路网上漂移。"},"gameplay":{"tag":"creative city-builder and drifting simulation","text":"draw road networks, place buildings and Sakura trees, then deploy a car to navigate the track; features automatic drifting mechanics, lap timing, and speed adjustment in a sandbox simulation loop.","tagZh":"创意城建与漂移模拟","textZh":"绘制道路网、摆放建筑和樱花树，再放出一辆车沿赛道行驶；在沙盒模拟循环中具备自动漂移机制、圈速计时和速度调节。"},"artStyle":{"tag":"anime-style flat vector","text":"clean anime-inspired art style with flat vector graphics, a vibrant palette of sky blue, pink Sakura, and lime green grass, featuring a Panda AE86 car and minimalist UI.","tagZh":"动漫风扁平矢量","textZh":"干净的动漫风美术，采用扁平矢量图形，色彩鲜艳，以天蓝、粉色樱花和青柠绿草地为主，还有熊猫配色的AE86和极简UI。"},"mood":{"tag":"relaxing and satisfying","text":"relaxing and satisfying creative experience with upbeat city-pop style music and playful sound effects for building and drifting.","tagZh":"轻松满足","textZh":"轻松而令人满足的创意体验，配有明快的city-pop风格音乐，以及搭建和漂移时俏皮的音效。"},"interaction":{"tag":"pointer drawing and UI sliders","text":"drag or click to draw grid-based roads and scenery; use UI buttons for tool switching and a slider for real-time car speed adjustment.","tagZh":"指针绘制与UI滑块","textZh":"拖动或点击以绘制基于网格的道路和景物；使用UI按钮切换工具，并用滑块实时调节车速。"},"social":{"tag":"single-player","text":"single-player creative sandbox focused on personal track construction and simulation.","tagZh":"单人游戏","textZh":"单人创意沙盒，专注于个人的赛道搭建与模拟。"}},"0144be9a-89f5-45b3-a4b3-36c029892120":{"subject":{"tag":"interactive 3D sandbox world","text":"a physics-driven 3D playground containing customizable player avatars, humanoid bots, spawnable vehicles like cars and helicopters, and interactive props including explosive barrels, weapons, and sports equipment.","tagZh":"互动3D沙盒世界","textZh":"一个物理驱动的3D游乐场，包含可自定义的玩家角色、人形机器人、可召唤的汽车和直升机等载具，以及爆炸桶、武器和运动器材等可互动道具。"},"gameplay":{"tag":"physics sandbox survival","text":"free-roaming sandbox gameplay featuring physics-based interactions, ragdoll mechanics, vehicle driving, and object spawning; includes survival elements like falling hazards and damage-induced ragdolling.","tagZh":"物理沙盒生存","textZh":"自由漫游的沙盒玩法，具备基于物理的互动、布娃娃机制、载具驾驶和物体召唤；含有坠落危险和受伤触发布娃娃等生存元素。"},"artStyle":{"tag":"stylized 3D blocks","text":"clean stylized 3D environment using primitive geometries and vibrant solid-color materials; features dynamic shadows, atmospheric skybox, and block-based character models with customizable hats.","tagZh":"风格化3D方块","textZh":"干净的风格化3D环境，使用基础几何体和鲜艳的纯色材质；具有动态阴影、富有氛围的天空盒，以及可自定义帽子的方块角色模型。"},"mood":{"tag":"chaotic and playful","text":"chaotic and playful atmosphere driven by unpredictable physics, silliness from ragdoll animations, and a lofi or ambient space soundtrack.","tagZh":"混乱欢闹","textZh":"混乱而欢闹的氛围，源于难以预测的物理效果、布娃娃动画的搞笑感，以及lofi或环境太空风格的配乐。"},"interaction":{"tag":"third-person touch controls","text":"virtual joystick and touch buttons for movement, jumping, crouching, and interaction; features dedicated menus for spawning objects, driving vehicles, and customizing character appearance.","tagZh":"第三人称触屏操作","textZh":"用虚拟摇杆和触屏按钮进行移动、跳跃、蹲下和互动；设有专门菜单用于召唤物体、驾驶载具和自定义角色外观。"},"social":{"tag":"real-time competition","text":"real-time competition featuring multiplayer lobby synchronization, global and world-specific chat systems, online player lists, and a collective voting system for world restarts.","tagZh":"实时竞技","textZh":"实时竞技，具备多人大厅同步、全局及世界专属的聊天系统、在线玩家列表，以及用于重启世界的集体投票系统。"}},"01800d05-ff85-416a-bfc5-62903ce2be87":{"subject":{"tag":"rocket launchpad","text":"a rocket and an astronaut at a launchpad transition into deep space","tagZh":"火箭发射台","textZh":"发射台上的火箭和宇航员，随后过渡到深空场景。"},"gameplay":{"tag":"arcade precision timing","text":"tap to stop a timer exactly at 5 seconds to launch a rocket; features a slowdown effect near the target and binary success or failure outcomes","tagZh":"街机精准计时","textZh":"点击使计时器恰好停在5秒以发射火箭；在临近目标时会有减速效果，结果为成功或失败的二元判定。"},"artStyle":{"tag":"sci-fi cinematic","text":"high-contrast digital art featuring neon cyan accents, warp-speed motion lines, and cinematic screen overlays","tagZh":"科幻电影感","textZh":"高对比度的数字艺术风格，配有霓虹青色点缀、曲速运动线条和电影感的屏幕叠加效果。"},"mood":{"tag":"tense anticipation","text":"tense and high-stakes with haptic feedback and dramatic sound effects leading to a satisfying warp-speed release","tagZh":"紧张期待","textZh":"紧张而高风险，配有触感反馈和戏剧性音效，最终迎来令人满足的曲速冲刺释放。"},"interaction":{"tag":"pointer down timing","text":"single pointer down interaction for start and stop timing, supported by vibration feedback for second intervals","tagZh":"按下计时","textZh":"通过单次按下操作来开始和停止计时，并以每秒间隔的震动反馈作为辅助。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"00a0ec5a-1c5b-44c6-ab1b-deb7205f75eb":{"subject":{"tag":"neon rainbow mandala","text":"a digital canvas for creating neon rainbow mandalas with symmetrical patterns and glowing light effects.","tagZh":"霓虹彩虹曼陀罗","textZh":"一块用于创作霓虹彩虹曼陀罗的数字画布，具有对称图案和发光光效。"},"gameplay":{"tag":"creative sandbox","text":"interactive drawing sandbox with 8-fold radial symmetry; user creates geometric patterns that automatically cycle through a rainbow color spectrum.","tagZh":"创意沙盒","textZh":"具有8重径向对称的互动绘图沙盒；用户创作的几何图案会自动循环变换整个彩虹色谱。"},"artStyle":{"tag":"neon glow minimalist","text":"high-contrast neon aesthetics featuring glowing HSL rainbow strokes against a pitch-black background with a minimalist frosted-glass UI.","tagZh":"霓虹发光极简","textZh":"高对比度的霓虹美学，在纯黑背景上呈现发光的HSL彩虹笔触，并配有极简的磨砂玻璃UI。"},"mood":{"tag":"zen relaxing","text":"soothing and meditative experience supported by ambient zen music and satisfying visual feedback from glowing strokes.","tagZh":"禅意放松","textZh":"舒缓而冥想式的体验，配有环境禅意音乐，以及发光笔触带来的令人满足的视觉反馈。"},"interaction":{"tag":"pointer drawing","text":"pointer-based drawing for pattern creation, with slider controls for brush size and a button to clear the canvas.","tagZh":"指针绘制","textZh":"基于指针的绘图来创作图案，配有调节笔刷大小的滑块和清空画布的按钮。"},"social":{"tag":"single-player","text":"single-player creative tool for individual artistic expression.","tagZh":"单人游戏","textZh":"面向个人艺术表达的单人创意工具。"}},"00d98718-0b09-4e34-a3e5-e2b5c057a9fc":{"subject":{"tag":"street football juggling","text":"a football ball and various collectible sneakers set against an urban city backdrop","tagZh":"街头足球颠球","textZh":"一颗足球和多款可收集的球鞋，背景为都市街景。"},"gameplay":{"tag":"arcade juggle simulation","text":"keep-up arcade loop where the user taps to kick a falling ball; features incremental difficulty with increasing gravity, currency collection, and a meta-game for purchasing and equipping different sneaker styles","tagZh":"街机颠球模拟","textZh":"颠球式街机循环，用户点击踢起下落的球；难度随重力增加而递增，含货币收集，以及购买和装备不同球鞋款式的养成玩法。"},"artStyle":{"tag":"urban street aesthetic","text":"high-contrast urban art style featuring a photorealistic background, vibrant neon UI elements, and distinct 2D sprite footwear","tagZh":"都市街头美学","textZh":"高对比度的都市艺术风格，配有照片级真实的背景、鲜艳的霓虹UI元素，以及个性鲜明的2D精灵球鞋。"},"mood":{"tag":"energetic urban","text":"upbeat and competitive with street-beat music, satisfying physical feedback from successful kicks, and the pressure of maintaining a high score","tagZh":"活力都市","textZh":"明快而具竞争性，配有街头节拍音乐、成功踢球带来的畅快物理反馈，以及维持高分的压力感。"},"interaction":{"tag":"tap and hover","text":"pointer movement to position the foot and tap/click to perform a kick, with haptic vibration feedback on hits and misses","tagZh":"点击与悬停","textZh":"移动指针来定位脚的位置，点击/单击来完成踢球，命中和失误时都有触感震动反馈。"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global world record leaderboard and persistent cloud-saved progress for currency and equipment","tagZh":"异步竞技","textZh":"异步竞技，设有全球世界纪录排行榜，并对货币和装备进度进行持久的云端存档。"}},"0146c6e8-b5d8-44c8-97c4-6429b3207fc7":{"subject":{"tag":"water physics drawing","text":"a physics-based puzzle world featuring water drops falling from a tap into a target cup, with static obstacles and user-created lines.","tagZh":"水流物理绘制","textZh":"一个基于物理的解谜世界，水滴从水龙头落入目标杯中，场景中有静态障碍物和用户绘制的线条。"},"gameplay":{"tag":"line-drawing physics puzzle","text":"draw permanent rigid lines to guide flowing water particles into a container; includes 50 levels of increasing difficulty with gravity-based physics and specific fill targets.","tagZh":"画线物理解谜","textZh":"绘制固定的刚性线条以引导流动的水粒子进入容器；含50个难度递增的关卡，采用基于重力的物理机制和特定的注满目标。"},"artStyle":{"tag":"clean minimalist flat","text":"clean minimalist interface with a slate-colored grid background, flat geometric obstacles, and bright blue circular water particles rendered on a 2D canvas.","tagZh":"简洁极简扁平","textZh":"简洁的极简界面，石板灰色网格背景、扁平的几何障碍物，以及在2D画布上渲染的亮蓝色圆形水粒子。"},"mood":{"tag":"soothing focus","text":"soothing and satisfying with calm puzzle background music and tactile drawing sounds, providing a focused problem-solving experience.","tagZh":"舒缓专注","textZh":"舒缓而令人满足，配有平静的解谜背景音乐和有触感的绘制音效，带来专注的解题体验。"},"interaction":{"tag":"drawing and dragging","text":"primary pointer-based drawing to create physical line segments; features standard UI buttons for level navigation and restarts.","tagZh":"绘制与拖动","textZh":"主要通过基于指针的绘制来创建具有物理属性的线段；配有用于关卡切换和重开的标准UI按钮。"},"social":{"tag":"single-player","text":"single-player experience focused on individual level progression across a 50-stage campaign.","tagZh":"单人游戏","textZh":"单人体验，专注于50个关卡战役中的个人闯关进阶。"}},"01b0eb6c-c5f5-4bb2-a329-c29c33b52f6d":{"subject":{"tag":"spin art studio","text":"a digital spin art studio featuring paint splatters on paper texture within a creative workshop environment","tagZh":"旋转画工作室","textZh":"一个数字旋转画工作室，在纸张纹理上呈现颜料飞溅效果，营造出富有创意的工坊环境。"},"gameplay":{"tag":"creative painting sandbox","text":"interactive canvas sandbox where users apply paint splatters to a rotating disk; featuring centrifugal physics simulation where paint streaks outward based on spin speed and symmetry modes","tagZh":"创意绘画沙盒","textZh":"互动画布沙盒，用户在旋转的圆盘上泼洒颜料；具备离心物理模拟，颜料会根据旋转速度和对称模式向外拉出条纹。"},"artStyle":{"tag":"modern neon studio","text":"modern studio aesthetic with neon accents and high-contrast paint colors against a realistic paper texture, utilizing a 2D canvas with rotating layers and blurred UI overlays","tagZh":"现代霓虹工作室","textZh":"现代工作室美学， const cmax=Math.max(...counts,1);
document.getElementById("bars").innerHTML=bins.map(([lo,hi],i)=>
  `<div class="bcol"><div class="n">${counts[i]}</div>`+
  `<div class="bar" style="height:${Math.max(4,counts[i]/cmax*100)}%"></div>`+
  `<div class="lbl">${lo.toFixed(2)}–${hi.toFixed(2)}</div></div>`).join("");
const rankAvg=[1,2,3,4,5].map(r=>{
  const v=ROWS.map(d=>d.top5.find(t=>t.rank===r).score);
  return v.reduce((a,b)=>a+b,0)/v.length;});
document.getElementById("rankavg").innerHTML=rankAvg.map((a,i)=>
  `<span class="ra">Rank ${i+1} 均分 <b>${a.toFixed(3)}</b></span>`).join("");

const S_LO=0.75,S_HI=0.97;
const scale=s=>Math.max(0,Math.min(1,(s-S_LO)/(S_HI-S_LO)))*100;

function dimsHtml(pid){
  const d=DESC[pid]||{};
  return QDIMS.map(def=>{
    const v=d[def.key]||{};
    return `<div class="dim" style="--dc:${def.color}">
      <div class="dlabel">${def.label}</div>
      <div><span class="dtag">${esc(v.tag)}</span> <span class="dtagzh">${esc(v.tagZh)}</span></div>
      <div class="dtext">${esc(v.text)}</div>
      <div class="dtextzh">${esc(v.textZh)}</div>
    </div>`;
  }).join("");
}
function subjOf(pid){const s=(DESC[pid]||{}).subject||{};return{en:s.tag||"—",zh:s.tagZh||""};}

const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
const emptyEl=document.getElementById("empty");

function cardHtml(item,idx){
  const rootPid=item.projectId;
  const rs=subjOf(rootPid);
  const t5=item.top5.map(t=>{
    const s=subjOf(t.projectId);
    return `<details class="t5">
      <summary class="t5sum">
        <div class="rank r${t.rank}">${t.rank}</div>
        <div class="t5info">
          <div class="rsub">${esc(s.en)}</div>
          <div class="rsubzh">${esc(s.zh)}</div>
          <div class="rpid" title="点击复制此 projectId">${t.projectId}</div>
        </div>
        <div class="rscore">
          <div class="val">${t.score.toFixed(3)}</div>
          <div class="track"><div class="fill" style="width:${scale(t.score)}%"></div></div>
          <div class="hint">▸ 点击展开6维</div>
        </div>
      </summary>
      <div class="t5body"><div class="dims">${dimsHtml(t.projectId)}</div></div>
    </details>`;}).join("");
  const groupPids=[rootPid,...item.top5.map(t=>t.projectId)];
  return `<div class="card">
    <div class="card-head">
      <div class="num">${idx+1}</div>
      <div class="qhead">
        <div class="qsub">${esc(rs.en)}</div>
        <div class="qsubzh">${esc(rs.zh)}</div>
        <div class="pid" title="点击复制此 projectId">${rootPid}</div>
      </div>
      <button class="copybtn" data-pids="${groupPids.join(",")}" title="复制本组全部 6 个 projectId">📋 复制全部 pid</button>
    </div>
    <div class="sec-label">根 Case · 6 维画像</div>
    <div class="dims">${dimsHtml(rootPid)}</div>
    <div class="sec-label">Top 5 相似召回 · 点击任意项展开其 6 维描述</div>
    <div class="top5">${t5}</div>
  </div>`;
}

function searchText(item){
  const parts=[item.projectId];
  const collect=pid=>{const d=DESC[pid]||{};for(const k in d){const v=d[k];parts.push(v.tag,v.text,v.tagZh,v.textZh);}};
  collect(item.projectId);
  item.top5.forEach(t=>{parts.push(t.projectId);collect(t.projectId);});
  return parts.join(" ").toLowerCase();
}
ROWS.forEach(d=>d._search=searchText(d));

function render(){
  const term=document.getElementById("search").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let list=ROWS.map((d,i)=>({d,i}));
  if(term) list=list.filter(x=>x.d._search.includes(term));
  if(sort==="scoreDesc") list.sort((a,b)=>b.d.top5[0].score-a.d.top5[0].score);
  else if(sort==="scoreAsc") list.sort((a,b)=>a.d.top5[0].score-b.d.top5[0].score);
  grid.innerHTML=list.map(x=>cardHtml(x.d,x.i)).join("");
  countEl.textContent=`显示 ${list.length} / ${ROWS.length}`;
  emptyEl.style.display=list.length?"none":"block";
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("zhToggle").addEventListener("change",e=>{
  document.querySelector(".wrap").classList.toggle("hide-zh",!e.target.checked);
});

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);return Promise.resolve();
}
grid.addEventListener("click",e=>{
  const btn=e.target.closest(".copybtn");
  if(btn){e.preventDefault();
    const pids=btn.dataset.pids.split(",");
    copyText(pids.join("\n")).then(()=>{const old=btn.textContent;btn.classList.add("ok");
      btn.textContent=`✓ 已复制 ${pids.length} 个`;
      setTimeout(()=>{btn.classList.remove("ok");btn.textContent=old;},1400);});
    return;}
  const pidEl=e.target.closest(".pid,.rpid");
  if(pidEl){e.preventDefault();const t=pidEl.textContent.trim();
    copyText(t).then(()=>{const old=pidEl.textContent;pidEl.textContent="✓ 已复制";
      setTimeout(()=>{pidEl.textContent=old;},900);});}
});
render();
</script>
</body>
</html>
