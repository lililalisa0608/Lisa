  .bcol .n{font-size:.72rem;color:var(--txt);font-weight:600}

  /* rank avg legend */

  .controls input{width:min(360px,60vw)}
  .controls input:focus,.controls select:focus{border-color:var(--accent)}
  .controls .count{font-size:.82rem;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--border);border-radius:16px;padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .18s,box-shadow .18s}

  .card-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;

  .card-head .pid{font-size:.68rem;color:var(--muted);font-family:ui-monospace,monospace}

  /* query tag chips */
  .qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .qtag{font-size:.7rem;padding:3px 9px;border-radius:999px;border:1px solid var(--tc);
    color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}

  .sec-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;font-weight:700;margin-bottom:8px}

  /* top5 rows */
  .top5{display:flex;flex-direction:column;gap:8px}
  .row{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;

  .rank{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    font-weight:700;font-size:.8rem;color:#fff}
  .rank.r1{background:#e3b341;color:#3a2d00}.rank.r2{background:#b6c2cf;color:#1b2029}

  .rscore{text-align:right;min-width:104px}
  .rscore .val{font-size:.82rem;font-weight:700;color:var(--accent)}
  .rscore .track{width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
  .rscore .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3fb950,#58a6ff)}

  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
  .empty{text-align:center;color:var(--muted);padding:60px;font-size:.95rem}

const cmax=Math.max(...counts);
document.getElementById("bars").innerHTML=bins.map(([lo,hi],i)=>
  `<div class="bcol"><div class="n">${counts[i]}</div>`+
  `<div class="bar" style="height:${Math.max(4,counts[i]/cmax*100)}%"></div>`+
  `<div class="lbl">${lo.toFixed(2)}–${hi.toFixed(2)}</div></div>`).join("");

// rank averages
const rankAvg=[1,2,3,4,5].map(r=>{
  const v=DATA.map(d=>d.top5.find(t=>t.rank===r).score);
  return (v.reduce((a,b)=>a+b,0)/v.length);
});
document.getElementById("rankavg").innerHTML=rankAvg.map((a,i)=>
  `<span class="ra">Rank ${i+1} 均分 <b>${a.toFixed(3)}</b></span>`).join("");

// scale for score bars: map [0.75,0.97] -> [0,1]
const S_LO=0.75,S_HI=0.97;
const scale=s=>Math.max(0,Math.min(1,(s-S_LO)/(S_HI-S_LO)))*100;

const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
const emptyEl=document.getElementById("empty");

function cardHtml(item,idx){
  const q=item.queryTags;
  const qtags=QDIMS.map(d=>q[d.key]?`<span class="qtag" style="--tc:${d.color}">${q[d.key]}</span>`:"").join("");
  const rows=item.top5.map(t=>
    `<div class="row">
       <div class="rank r${t.rank}">${t.rank}</div>
       <div class="rinfo">
         <div class="rsub">${t.subject||"—"}</div>
         <div class="rmeta">${[t.gameplay,t.artStyle].filter(Boolean).join(" · ")}</div>
       </div>
       <div class="rscore">
         <div class="val">${t.score.toFixed(3)}</div>
         <div class="track"><div class="fill" style="width:${scale(t.score)}%"></div></div>
       </div>
     </div>`).join("");
  return `<div class="card">
    <div class="card-head">
      <div class="num">${idx+1}</div>
      <div>
        <div class="qsub">${q.subject||"(无题材)"}</div>
        <div class="pid">${item.projectId}</div>
      </div>
    </div>
    <div class="qtags">${qtags}</div>
    <div class="sec-label">Top 5 相似召回</div>
    <div class="top5">${rows}</div>
  </div>`;
}

function searchText(item){
  const q=item.queryTags;
  const parts=[item.projectId,...Object.values(q)];
  item.top5.forEach(t=>parts.push(t.subject,t.gameplay,t.artStyle));
  return parts.join(" ").toLowerCase();
}
DATA.forEach(d=>d._search=searchText(d));

function render(){
  const term=document.getElementById("search").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let list=DATA.map((d,i)=>({d,i}));
  if(term) list=list.filter(x=>x.d._search.includes(term));
  if(sort==="scoreDesc") list.sort((a,b)=>b.d.top5[0].score-a.d.top5[0].score);
  else if(sort==="scoreAsc") list.sort((a,b)=>a.d.top5[0].score-b.d.top5[0].score);
  grid.innerHTML=list.map((x,j)=>cardHtml(x.d,x.i)).join("");
  countEl.textContent=`显示 ${list.length} / ${DATA.length}`;
  emptyEl.style.display=list.length?"none":"block";
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
render();
</script>
</body>
</html>
