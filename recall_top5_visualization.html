<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目召回 Top5 相似度可视化 · 双语 · v2</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2b3444;
    --txt:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --zh:#7ee0b8;
    --c-subject:#f778ba; --c-gameplay:#58a6ff; --c-art:#bc8cff;
    --c-mood:#f0883e; --c-interaction:#3fb950; --c-social:#e3b341;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#18202e 0%,var(--bg) 55%);
    color:var(--txt);min-height:100vh;line-height:1.55}
  .wrap{max-width:1360px;margin:0 auto;padding:32px 20px 60px}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:1.8rem;font-weight:700;letter-spacing:.5px}
  header p{color:var(--muted);margin-top:8px;font-size:.92rem}
  .meta-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:7px 16px;font-size:.82rem;color:var(--muted)}
  .chip b{color:var(--txt);font-size:.95rem}

  .distro{max-width:640px;margin:22px auto 0;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:16px 20px}
  .distro h3{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:12px;
    text-transform:uppercase;letter-spacing:.5px;text-align:center}
  .bars{display:flex;align-items:flex-end;gap:10px;height:110px;justify-content:center}
  .bcol{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .bcol .bar{width:100%;background:linear-gradient(180deg,var(--accent),#8957e5);
    border-radius:6px 6px 0 0;margin-top:auto;min-height:4px;transition:height .6s}
  .bcol .n{font-size:.72rem;color:var(--txt);font-weight:600}
  .bcol .lbl{font-size:.68rem;color:var(--muted)}
  .rankavg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .rankavg .ra{font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.03);
    border:1px solid var(--border);border-radius:8px;padding:4px 10px}
  .rankavg .ra b{color:var(--accent)}

  .controls{position:sticky;top:0;z-index:20;display:flex;gap:12px;flex-wrap:wrap;
    align-items:center;justify-content:center;margin:26px 0 22px;padding:14px;
    background:rgba(13,17,23,.82);backdrop-filter:blur(10px);
    border:1px solid var(--border);border-radius:14px}
  .controls input,.controls select{background:var(--panel2);border:1px solid var(--border);
    color:var(--txt);border-radius:9px;padding:9px 14px;font-size:.86rem;outline:none}
  .controls input{width:min(360px,60vw)}
  .controls input:focus,.controls select:focus{border-color:var(--accent)}
  .controls .count{font-size:.82rem;color:var(--muted)}
  .controls label.tg{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px;align-items:start}
  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--border);border-radius:16px;padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);transition:box-shadow .18s}
  .card:hover{box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .card-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-weight:700;font-size:.95rem;background:linear-gradient(135deg,var(--accent),#8957e5);color:#fff}
  .qhead{min-width:0;flex:1}
  .qhead .qsub{font-weight:600;font-size:.95rem;color:var(--txt)}
  .qhead .qsubzh{font-size:.82rem;color:var(--zh);margin-top:1px}
  .qhead .pid{font-size:.68rem;color:var(--muted);font-family:ui-monospace,monospace;
    cursor:pointer;word-break:break-all;transition:color .15s;margin-top:2px}
  .qhead .pid:hover{color:var(--accent)}
  .copybtn{flex:0 0 auto;cursor:pointer;white-space:nowrap;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;
    font-size:.72rem;transition:all .15s}
  .copybtn:hover{border-color:var(--accent);color:var(--accent)}
  .copybtn.ok{border-color:var(--c-interaction);color:var(--c-interaction);
    background:color-mix(in srgb,var(--c-interaction) 14%,transparent)}

  .sec-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
    font-weight:700;margin:14px 0 8px}

  /* dimension blocks (root + expanded top5) */
  .dims{display:flex;flex-direction:column;gap:8px}
  .dim{background:rgba(255,255,255,.02);border:1px solid var(--border);
    border-left:3px solid var(--dc);border-radius:8px;padding:9px 11px}
  .dim .dlabel{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    color:var(--dc);margin-bottom:4px;display:flex;gap:6px;align-items:baseline}
  .dim .dtag{font-size:.84rem;font-weight:600;color:var(--txt)}
  .dim .dtagzh{font-size:.8rem;color:var(--zh)}
  .dim .dtext{font-size:.78rem;color:#c9d3de;margin-top:4px}
  .dim .dtextzh{font-size:.78rem;color:var(--zh);margin-top:3px}
  .hide-zh .dtagzh,.hide-zh .dtextzh,.hide-zh .qsubzh{display:none}

  /* top5 */
  .top5{display:flex;flex-direction:column;gap:8px}
  .t5{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .t5sum{list-style:none;cursor:pointer;padding:9px 11px;display:grid;
    grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
  .t5sum::-webkit-details-marker{display:none}
  .rank{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    font-weight:700;font-size:.8rem;color:#fff}
  .rank.r1{background:#e3b341;color:#3a2d00}.rank.r2{background:#b6c2cf;color:#1b2029}
  .rank.r3{background:#cd7f32}.rank.r4{background:#3d4756}.rank.r5{background:#333c49}
  .t5info{min-width:0}
  .t5info .rsub{font-size:.83rem;color:var(--txt);font-weight:600}
  .t5info .rsubzh{font-size:.76rem;color:var(--zh)}
  .t5info .rpid{font-size:.64rem;color:#6e7a8a;font-family:ui-monospace,monospace;
    cursor:pointer;word-break:break-all;margin-top:1px}
  .t5info .rpid:hover{color:var(--accent)}
  .rscore{text-align:right;min-width:104px}
  .rscore .val{font-size:.82rem;font-weight:700;color:var(--accent)}
  .rscore .track{width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);
    margin-top:4px;overflow:hidden;margin-left:auto}
  .rscore .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3fb950,#58a6ff)}
  .rscore .hint{font-size:.6rem;color:var(--muted);margin-top:3px}
  .t5body{padding:0 11px 11px}

  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
  .empty{text-align:center;color:var(--muted);padding:60px;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 项目召回 Top5 相似度 · 双语</h1>
    <p>projectrecall v2 · 102 个查询项目 · 6 维画像(标签+描述,中英对照)· 每个召回最相似的 5 个项目</p>
    <div class="meta-bar" id="metaBar"></div>
    <div class="distro">
      <h3>相似度分数分布 (score distribution)</h3>
      <div class="bars" id="bars"></div>
      <div class="rankavg" id="rankavg"></div>
    </div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="🔍 搜索 标签/描述/中文/projectId …">
    <select id="sort">

      <option value="scoreDesc">Top1 分数 ↓</option>
      <option value="scoreAsc">Top1 分数 ↑</option>

    <label class="tg"><input type="checkbox" id="zhToggle" checked> 显示中文</label>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的结果 · No matches</div>
  <footer>数据来源：projectrecalltop5cleanedv2.jsonl · 中文为机器翻译 · 生成于 2026-07-01</footer>
</div>

tion for managing multiple upgrade tiers","tagZh":"点击操作","textZh":"主要通过点击输入来生成质量并摧毁经过的彗星，并通过菜单导航管理多个升级层级"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01cff1e2-3231-4bdc-9abb-fb9346a3c465":{"subject":{"tag":"ice cream stacker","text":"a cheerful ice cream parlor setting with falling strawberry, chocolate, and vanilla scoops being caught on a waffle cone","tagZh":"冰淇淋叠叠乐","textZh":"一个欢乐的冰淇淋店场景，用蛋卷筒接住掉落的草莓、巧克力和香草冰淇淋球"},"gameplay":{"tag":"arcade collection","text":"arcade timing and collection; catch falling scoops to build an increasingly high stack while dodging failure; includes speed progression and a three-life survival system","tagZh":"街机收集","textZh":"街机式计时与收集；接住掉落的冰淇淋球堆得越来越高，同时避免失败；包含速度递进和三条命的生存系统"},"artStyle":{"tag":"pastel cartoon","text":"colorful pastel cartoon style with vibrant ice cream assets, 2D canvas rendering, particle effects, and a soft-toned background","tagZh":"粉彩卡通","textZh":"色彩缤纷的粉彩卡通风格，配有鲜艳的冰淇淋素材、2D 画布渲染、粒子效果和柔和色调的背景"},"mood":{"tag":"cheerful and sweet","text":"cheerful, sweet, and satisfying, featuring upbeat arcade background music and playful sound effects for successful catches","tagZh":"欢乐又甜蜜","textZh":"欢乐、甜蜜且令人满足，配有轻快的街机背景音乐和成功接住时俏皮的音效"},"interaction":{"tag":"drag to move","text":"drag and pointer movement to control the horizontal position of the character and cone","tagZh":"拖动移动","textZh":"通过拖动和指针移动来控制角色和蛋卷筒的水平位置"},"social":{"tag":"single-player","text":"single-player experience with a local high-score result screen","tagZh":"单人游戏","textZh":"带有本地高分结算界面的单人体验"}},"00592d2d-27dd-4635-9338-d09c9cf64761":{"subject":{"tag":"numbered tile grid","text":"A 10x10 grid of numbered tiles from 1 to 100 set against a deep blue cosmic background.","tagZh":"数字方块网格","textZh":"一个 10x10 的数字方块网格，编号从 1 到 100，背景为深蓝色宇宙"},"gameplay":{"tag":"binary search puzzle","text":"Logic-based elimination game where the player identifies a secret target number through high/low feedback; selecting tiles narrows the range by visu bolic mood with comedic frustration from the central character as money is spent.","tagZh":"搞笑又夸张","textZh":"轻松而夸张的氛围，随着钱被花掉，主角会流露出喜剧式的懊恼"},"interaction":{"tag":"click-based purchasing","text":"Primary interaction via clicking buy and sell buttons to manage inventory and balance, featuring scrollable item lists.","tagZh":"点击式购买","textZh":"主要通过点击购买和出售按钮来管理库存与余额，配有可滚动的物品列表"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"02084984-40f2-429e-90ee-954f677c8a8b":{"subject":{"tag":"influencer lifestyle simulator","text":"a simulated social media platform called FameLens featuring personal profile customization, followers, and a community of diverse personas including robots, pets, and internet personalities.","tagZh":"网红生活模拟","textZh":"一个名为 FameLens 的模拟社交媒体平台，支持个人资料定制、粉丝系统，以及由机器人、宠物和网络红人等多样角色组成的社区"},"gameplay":{"tag":"creative camera challenge","text":"capture real-world photos to fulfill specific daily challenges for bonus rewards; use camera-based uploads to generate viral posts, gain followers, and receive AI-driven captions and community feedback.","tagZh":"创意拍照挑战","textZh":"拍摄真实照片以完成特定的每日挑战获取额外奖励；通过相机上传生成爆款帖子、涨粉，并获得 AI 生成的配文和社区反馈"},"artStyle":{"tag":"modern dark-mode app","text":"sleek dark-mode social media interface with neon pink and purple gradients, featuring high-contrast UI elements, circular avatar framing, and vibrant notification overlays.","tagZh":"现代深色模式应用","textZh":"时尚的深色模式社交媒体界面，配有霓虹粉与紫色渐变、高对比度的 UI 元素、圆形头像框以及鲜艳的通知浮层"},"mood":{"tag":"exciting viral ambition","text":"energetic and addictive, capturing the fast-paced thrill of gaining online fame through satisfying audio feedback and simulated community engagement.","tagZh":"刺激的爆红野心","textZh":"充满活力且令人上瘾，通过令人满足的音效反馈和模拟的社区互动，捕捉网络爆红那种快节奏的刺激感"},"interaction":{"tag":"camera and touch","text":"camera-driven interaction for photo capture and profile updates, supplemented by touch-based button controls for feed navigation and profile editing.","tagZh":"相机与触控","textZh":"以相机驱 ,"01d9e0dd-09b6-42ad-a412-aabd6bef0158":{"subject":{"tag":"woodturning workshop","text":"a 3D woodturning workshop setting featuring a rotating wood log, various metal carving chisels, and a painter's palette.","tagZh":"木旋工坊","textZh":"一个 3D 木旋工坊场景，配有旋转的木料、各种金属雕刻凿子以及一块调色板"},"gameplay":{"tag":"arcade lathe simulation","text":"precision carving simulation where the user shapes a rotating log to match a blue wireframe guide; includes tool switching, wood painting, accuracy-based scoring, and a shop for upgrading materials and equipment.","tagZh":"街机车床模拟","textZh":"精准雕刻模拟，玩家将旋转的木料塑造成与蓝色线框引导相符的形状；包含工具切换、木料上色、基于精准度的评分，以及升级材料和设备的商店"},"artStyle":{"tag":"semi-realistic 3D","text":"semi-realistic 3D rendering using a mix of wood textures and workshop background imagery, featuring dynamic particle effects for wood chips and a clean, modern UI overlay.","tagZh":"半写实 3D","textZh":"半写实 3D 渲染，混合使用木料纹理和工坊背景图像，配有木屑的动态粒子效果以及简洁现代的 UI 浮层"},"mood":{"tag":"satisfying and focused","text":"satisfying and focused, driven by the rhythmic tactile feedback of carving and the reward of precision craftsmanship.","tagZh":"解压又专注","textZh":"令人满足而专注，由雕刻的节奏性触觉反馈以及精湛工艺的成就感所驱动"},"interaction":{"tag":"drag-to-carve","text":"pointer-based drag and move to control tool depth and height against the rotating log, with button-based menu navigation and tool selection.","tagZh":"拖动雕刻","textZh":"通过指针拖动和移动来控制工具在旋转木料上的深度和高度，并通过按钮进行菜单导航和工具选择"},"social":{"tag":"single-player","text":"single-player experience focused on individual progression and personal high scores for accuracy.","tagZh":"单人游戏","textZh":"专注于个人进程和精准度个人最高分的单人体验"}},"0129ac11-f450-49d9-927d-a921e9e02c43":{"subject":{"tag":"imposter chat survival","text":"a suspenseful psychological horror setting involving suspicious text messages from family members who are actually supernatural imposters","tagZh":"冒充者聊天生存","textZh":"悬疑心理恐怖设定，你会收到疑似家人发来的可疑短信，而他们实际上是超自然的冒充者"},"gameplay":{"tag":"narrative deduction","text":"interactive chat simulation where the player must identify logical inconsistencies in messages to expose imposters; failure to detect lies leads to jumpscares and death while correct identification progresses levels","tagZh":"叙事推理","textZh":"互动聊天模拟，玩家须找出消息中的逻辑破绽来揭穿冒充者；未能识破谎言会触发惊吓并导致死亡，正确识别则可推进关卡"},"artStyle":{"tag":"smartphone interface","text":"realistic smartphone messaging app UI with dark mode styling, blue and gray speech bubbles, and hidden jumpscare imagery","tagZh":"智能手机界面","textZh":"逼真的手机短信应用UI，采用深色模式，蓝灰配色的对话气泡，并隐藏着惊吓画面"},"mood":{"tag":"tense psychological horror","text":"tense and unsettling atmosphere supported by creepy ambient music, deceptive manipulation, and sudden audio-visual scares","tagZh":"紧张的心理恐怖","textZh":"紧张不安的氛围，配以诡异的环境音乐、欺骗性的操纵手段和突如其来的视听惊吓"},"interaction":{"tag":"typing and chat","text":"typing and sending text responses via an on-screen input field and button to communicate with characters","tagZh":"打字与聊天","textZh":"通过屏幕上的输入框和按钮打字发送文字回复，与角色交流"},"social":{"tag":"single-player","text":"single-player experience focused on individual deduction and narrative choices","tagZh":"单人","textZh":"单人体验，专注于个人推理与叙事抉择"}},"0194966a-aed4-42fb-a147-4ed71b15b211":{"subject":{"tag":"neon cyber teddy","text":"a teddy bear face navigating through a neon-tinted cave with jagged geometric walls and spikes","tagZh":"霓虹赛博泰迪熊","textZh":"一张泰迪熊的脸穿行于霓虹色调的洞穴，四周是锯齿状的几何墙壁和尖刺"},"gameplay":{"tag":"side-scrolling precision flyer","text":"side-scrolling arcade survival where the player controls altitude to navigate a narrow corridor; features procedural level generation, collision-based failure, and stage progression","tagZh":"横版精准飞行","textZh":"横版街机生存玩法，玩家控制高度穿越狭窄通道；具备程序化关卡生成、碰撞即失败和关卡推进机制"},"artStyle":{"tag":"cyberpunk neon pixel","text":"high-contrast cyberpunk aesthetic featuring emerald green neon outlines, a dark background with grid overlays, and red hazard spikes","tagZh":"赛博朋克霓虹像素","textZh":"高对比度的赛博朋克风格，以翠绿霓虹轮廓、带网格叠层的深色背景和红色危险尖刺为特色"},"mood":{"tag":"intense electronic","text":"intense and focused with a high-energy electronic soundtrack, supplemented by percussive collision sounds and satisfying win fanfares","tagZh":"激烈电子","textZh":"激烈且专注，搭配高能电子配乐，辅以打击感十足的碰撞音效和令人满足的胜利号角声"},"interaction":{"tag":"hold-to-rise timing","text":"long-press and hold to move the character upward against gravity, releasing to descend; includes a level selection menu and leaderboard UI","tagZh":"长按上升的时机把控","textZh":"长按使角色克服重力上升，松开则下降；包含关卡选择菜单和排行榜UI"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global leaderboard ranking players by their highest unlocked level","tagZh":"异步竞技","textZh":"异步竞技，设有全球排行榜，按玩家已解锁的最高关卡进行排名"}},"01cb35ef-fb50-4109-996e-ac1e7e4d2394":{"subject":{"tag":"interactive particle field","text":"thousands of luminous digital nodes arranged in a dense grid, reacting to user-generated energy fields.","tagZh":"互动粒子场","textZh":"数千个发光的数字节点排列成密集网格，对用户产生的能量场作出反应。"},"gameplay":{"tag":"physics distortion sandbox","text":"a physics-based manipulation sandbox where players toggle between Attract, Repel, Orbit, and Forcefield modes to distort a responsive node field with real-time parameter controls for gravity, friction, and visual decay.","tagZh":"物理扭曲沙盒","textZh":"基于物理的操控沙盒，玩家可在吸引、排斥、环绕和力场模式间切换，扭曲响应式节点场，并可实时调节重力、摩擦力和视觉衰减等参数。"},"artStyle":{"tag":"cybernetic neon minimalism","text":"high-contrast cybernetic aesthetic featuring a slate-black background, cyan and violet neon particles, luminous motion trails, and a clean monospace HUD.","tagZh":"赛博霓虹极简","textZh":"高对比度的赛博美学，以石板黑背景、青紫霓虹粒子、发光运动轨迹和简洁的等宽字体HUD为特色。"},"mood":{"tag":"hypnotic and technological","text":"hypnotic and meditative with a high-tech laboratory atmosphere, emphasized by ambient humming and shimmering sound effects.","tagZh":"催眠而科技","textZh":"催眠般冥想的氛围，充满高科技实验室气息，并以环境嗡鸣声和闪烁音效加以烘托。"},"interaction":{"tag":"multi-touch manipulation","text":"multi-touch or mouse interaction to exert physical forces on the field, with slider-based UI for fine-tuning simulation physics.","tagZh":"多点触控操控","textZh":"通过多点触控或鼠标对场施加物理力，并配有滑块式UI用于微调模拟物理参数。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"00c3da3e-f7a0-4d72-bea8-eeb9773ae0b6":{"subject":{"tag":"celestial sandbox","text":"a cosmic environment featuring planets, stars, galaxies, black holes, nebulae, and customizable lifeforms.","tagZh":"天体沙盒","textZh":"一个宇宙环境，包含行星、恒星、星系、黑洞、星云和可自定义的生命体。"},"gameplay":{"tag":"space physics simulation","text":"sandbox simulation focusing on gravitational n-body physics; users spawn celestial bodies, establish stable orbits, manage planetary evolution, and design custom animals.","tagZh":"太空物理模拟","textZh":"以引力多体物理为核心的沙盒模拟；用户可生成天体、建立稳定轨道、管理行星演化，并设计自定义动物。"},"artStyle":{"tag":"3D realistic space","text":"3D space rendering with realistic celestial textures, procedural planet surfaces, volumetric-style nebulae, and glowing orbital paths against a starfield background.","tagZh":"3D写实太空","textZh":"3D太空渲染，具备写实的天体材质、程序化的行星表面、体积感星云，以及在星空背景下发光的轨道路径。"},"mood":{"tag":"grand meditative","text":"meditative and awe-inspiring, emphasizing the immense scale of the universe and the slow pacing of cosmic evolution.","tagZh":"宏大冥想","textZh":"冥想而令人敬畏，突出宇宙的浩瀚尺度和天体演化的缓慢节奏。"},"interaction":{"tag":"spatial manipulation","text":"3D orbit controls for navigation combined with click-to-spawn mechanics, slider-based property adjustments, and a drag-and-drop animal part editor.","tagZh":"空间操控","textZh":"3D环绕视角控制用于导航，结合点击生成机制、滑块式属性调节和拖放式动物部件编辑器。"},"social":{"tag":"single-player","text":"single-player experience with local state persistence for saving and loading custom galaxy configurations.","tagZh":"单人","textZh":"单人体验，支持本地状态持久化，可保存和加载自定义星系配置。"}},"009850fc-ee28-4c20-a0fc-9dfc331a2970":{"subject":{"tag":"neon mandala creator","text":"a digital kaleidoscope canvas set against a deep space-black background featuring glowing symmetry patterns","tagZh":"霓虹曼陀罗创作器","textZh":"一块数字万花筒画布，衬以深邃的太空黑背景，呈现发光的对称图案"},"gameplay":{"tag":"creative sandbox","text":"sandbox drawing tool where users create kaleidoscopic patterns using adjustable symmetry, brush size, and rotation speed; includes a rainbow color cycle and stationary or spinning canvas modes","tagZh":"创意沙盒","textZh":"沙盒绘图工具，用户可通过可调节的对称度、笔刷大小和旋转速度创作万花筒图案；包含彩虹变色循环以及静止或旋转的画布模式"},"artStyle":{"tag":"neon minimalist","text":"high-contrast minimalist aesthetic with neon glowing lines, translucent UI overlays, and sleek dark-mode design","tagZh":"霓虹极简","textZh":"高对比度的极简美学，配以霓虹发光线条、半透明UI叠层和时尚的深色模式设计"},"mood":{"tag":"relaxing meditative","text":"calm and meditative atmosphere focused on satisfying visual feedback and rhythmic creation","tagZh":"放松冥想","textZh":"平静冥想的氛围，专注于令人满足的视觉反馈和富有节奏的创作"},"interaction":{"tag":"drag and draw","text":"drag or swipe to draw with auto-closing configuration menus for spin speed, symmetry count, and color selection","tagZh":"拖动绘制","textZh":"拖动或滑动来绘制，旋转速度、对称数量和颜色选择的配置菜单可自动收起"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01f941c5-79ad-465d-b8ee-1d2a5277a496":{"subject":{"tag":"video rating gallery","text":"A series of short video clips within a dark-themed cinematic viewing interface designed for user evaluation.","tagZh":"视频评分画廊","textZh":"在深色主题的影院式观看界面中呈现的一系列短视频片段，专为用户评价而设计。"},"gameplay":{"tag":"video scoring survey","text":"A sequential rating loop where the user watches four video clips and assigns a one-to-five star score to each; includes a final summary with community leaderboard data.","tagZh":"视频评分调查","textZh":"循序渐进的评分循环，用户观看四段视频片段并为每段打出一到五星的评分；结尾附有包含社区排行榜数据的总结。"},"artStyle":{"tag":"dark cinematic minimalist","text":"Clean, modern mobile-first interface with dark gradients, white typography, and a prominent focus on full-screen video content.","tagZh":"深色影院极简","textZh":"简洁现代的移动优先界面，采用深色渐变、白色字体，并着重突出全屏视频内容。"},"mood":{"tag":"satisfying and focused","text":"Focused and high-end feel with satisfying star-selection feedback and a calm, evaluative atmosphere.","tagZh":"满足而专注","textZh":"专注而高端的质感，配以令人满足的星级选择反馈和平静的评价氛围。"},"interaction":{"tag":"tap rating","text":"Direct tap or click interaction on a five-star scale to submit ratings and progress through the video sequence.","tagZh":"点击评分","textZh":"在五星量表上直接点击或点按以提交评分，并推进视频序列。"},"social":{"tag":"asynchronous competition","text":"asynchronous competition; users submit ratings which are aggregated into community leaderboards for each video clip.","tagZh":"异步竞技","textZh":"异步竞技；用户提交的评分会被汇总为每段视频片段的社区排行榜。"}},"0055bd3f-2afb-4c29-a043-e30a555ab7e9":{"subject":{"tag":"multibiome modular city","text":"a sandbox city environment featuring diverse themes including cyberpunk metropolis, medieval castle, prehistoric dinosaur valley, and space colony biomes with corresponding buildings and roaming AI vehicles","tagZh":"多生态模块化城市","textZh":"一个沙盒城市环境，涵盖赛博朋克大都市、中世纪城堡、史前恐龙谷和太空殖民地等多样主题生态，配有相应的建筑和四处行驶的AI车辆"},"gameplay":{"tag":"sandbox city simulation","text":"grid-based city building with resource management, blueprint-guided construction, and environmental customization; features economy ticking, day/night cycles, and weather effects","tagZh":"沙盒城市模拟","textZh":"基于网格的城市建造，包含资源管理、蓝图指引的建设和环境自定义；具备经济运转、昼夜循环和天气效果"},"artStyle":{"tag":"3D low-poly voxel","text":"minimalist 3D low-poly voxel aesthetic with vibrant theme-specific palettes, emissive neon materials for futuristic biomes, and weather particle systems","tagZh":"3D低多边形体素","textZh":"极简的3D低多边形体素美学，配以鲜明的主题专属配色、未来生态的自发光霓虹材质，以及天气粒子系统"},"mood":{"tag":"creative and relaxing","text":"relaxing and creative, supported by calm background music and the satisfying visual feedback of placing modular components in an infinite plane","tagZh":"创意而放松","textZh":"放松而富有创意，辅以平静的背景音乐，以及在无限平面上放置模块化组件时令人满足的视觉反馈"},"interaction":{"tag":"click-to-build navigation","text":"primary click and hover interactions for placement, deletion, and rotation, with orbit camera controls for panning and zooming","tagZh":"点击建造导航","textZh":"以点击和悬停为主的交互进行放置、删除和旋转，并通过环绕镜头控制实现平移和缩放"},"social":{"tag":"single-player","text":"single-player experience focused on personal creation with local save and load slots for city progress","tagZh":"单人","textZh":"单人体验，专注于个人创作，提供本地存档槽以保存和加载城市进度"}},"014c63fa-ca30-4e9b-8c73-48578ce58e2a":{"subject":{"tag":"Amazing Digital Circus chat","text":"Characters from The Amazing Digital Circus including Jax, Caine, Pomni, Gangle, Ragatha, Kinger, and Zooble, set within a surreal digital world featuring the horrifying Abstracted creatures.","tagZh":"神奇数字马戏团聊天","textZh":"《神奇数字马戏团》中的角色，包括Jax、Caine、Pomni、Gangle、Ragatha、Kinger和Zooble，置身于一个超现实的数字世界，其中还有恐怖的抽象化生物。"},"gameplay":{"tag":"roleplay chat simulation","text":"Conversational roleplay with AI-driven characters; features a unique group chat mechanic where specific keywords like 'Abstracted' trigger character-specific behaviors, such as Caine departing the chat to handle emergencies.","tagZh":"角色扮演聊天模拟","textZh":"与AI驱动的角色进行对话式角色扮演；具备独特的群聊机制，诸如\"Abstracted\"这类特定关键词会触发角色的专属行为，例如Caine离开聊天去处理紧急情况。"},"artStyle":{"tag":"vibrant glitch aesthetic","text":"Vibrant and surreal dark-purple theme with glassmorphism UI, neon gradients, and animated particle effects reflecting a glitchy digital circus atmosphere.","tagZh":"鲜艳故障美学","textZh":"鲜艳而超现实的深紫色主题，配以玻璃拟态UI、霓虹渐变和动态粒子效果，映衬出充满故障感的数字马戏团氛围。"},"mood":{"tag":"whimsical yet anxious","text":"Energetic and whimsical tone contrasted by undercurrents of anxiety, trauma, and surreal horror typical of the Digital Circus setting.","tagZh":"奇趣却焦虑","textZh":"活力奇趣的基调，与暗流涌动的焦虑、创伤和超现实恐怖形成对比，这正是数字马戏团设定的典型特征。"},"interaction":{"tag":"typing and character selection","text":"Text input for chatting, button clicks for character selection, and keyboard 'Enter' for sending messages.","tagZh":"打字与角色选择","textZh":"通过文字输入聊天，点击按钮选择角色，并按键盘的\"Enter\"键发送消息。"},"social":{"tag":"single-player","text":"single-player chat simulation interacting with AI-controlled entities.","tagZh":"单人","textZh":"单人聊天模拟，与AI控制的实体互动。"}},"00769639-12ec-4b14-b8e0-50b5e0f83334":{"subject":{"tag":"underwater fishing","text":"A variety of fish species including Guppies, Silver Bass, and Golden Koi set against an aquatic underwater background.","tagZh":"水下钓鱼","textZh":"多种鱼类，包括孔雀鱼、银鲈和金锦鲤，衬以水下的海洋背景。"},"gameplay":{"tag":"arcade fishing timing","text":"Precision tracking gameplay where the player must keep a moving catch zone over a swimming fish to fill a progress bar; featuring variable fish speeds and difficulty ranks based on rarity.","tagZh":"街机钓鱼时机","textZh":"精准追踪玩法，玩家须让移动的捕捉区始终罩住游动的鱼，以填满进度条；鱼的速度各异，难度等级依稀有度而定。"},"artStyle":{"tag":"dark blue cartoon","text":"Cartoon-style digital graphics with a dark blue underwater theme, high-contrast neon green catch zones, and clean UI overlays.","tagZh":"深蓝卡通","textZh":"卡通风格的数字画面，采用深蓝色水下主题、高对比度的霓虹绿捕捉区和简洁的UI叠层。"},"mood":{"tag":"intense satisfying","text":"A blend of tense precision timing and satisfying success, accompanied by immersive reeling sound effects.","tagZh":"紧张满足","textZh":"紧张的精准时机把控与成功后的满足感相融合，并伴有沉浸式的收线音效。"},"interaction":{"tag":"hold to reel","text":"Hold to reel the catch zone upward and release to let it drop, using pointer events for vertical tracking.","tagZh":"长按收线","textZh":"长按使捕捉区向上收线，松开则让其下落，通过指针事件进行垂直追踪。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"0103eb5b-bee7-4030-8a63-2893552f6e30":{"subject":{"tag":"neon physics sandbox","text":"neon-colored springy lines and physics-based nodes in a dark space-like void with subtle background stars","tagZh":"霓虹物理沙盒","textZh":"霓虹色的弹性线条和基于物理的节点，置于深邃的太空般虚空中，背景点缀着若隐若现的星辰"},"gameplay":{"tag":"physics drawing sandbox","text":"drawing freehand paths that transform into springy physical noodles which fall, bounce, and collide using gravity and constraints","tagZh":"物理绘画沙盒","textZh":"徒手绘制路径，这些路径会变成弹性的物理面条，在重力和约束作用下坠落、弹跳并相互碰撞"},"artStyle":{"tag":"cyberpunk neon glow","text":"dark minimalist cyberpunk aesthetic featuring high-contrast neon glowing lines and white-core nodes against a deep blue-black background","tagZh":"赛博朋克霓虹辉光","textZh":"深色极简的赛博朋克美学，以高对比度的霓虹发光线条和白芯节点衬托于深蓝黑背景之上"},"mood":{"tag":"relaxing creative","text":"soothing and satisfying creative experience driven by tactile physics and gentle motion feedback","tagZh":"放松创意","textZh":"舒缓且令人满足的创作体验，由富有触感的物理效果和柔和的运动反馈驱动"},"interaction":{"tag":"draw and click","text":"drag to draw physics objects with tap interactions for color switching and clearing the canvas","tagZh":"绘制与点击","textZh":"拖动绘制物理对象，通过点击交互切换颜色和清空画布"},"social":{"tag":"single-player","text":"single-player creative sandbox environment","tagZh":"单人","textZh":"单人创意沙盒环境"}},"01ea85d5-b349-453b-9156-5b2ae8cf8a3e":{"subject":{"tag":"generative floral garden","text":"A field of interactive blooming flowers and floating typography controlled by user-defined moods and letters.","tagZh":"生成式花卉花园","textZh":"一片可互动的绽放花田和漂浮文字，由用户自定义的心情和字母来操控。"},"gameplay":{"tag":"generative sandbox","text":"Tap to create ripples and cycle through letters; swipe to sway flowers with breeze physics; customize the experience by inputting moods that generate unique color palettes and letter patterns using LLM integration.","tagZh":"生成式沙盒","textZh":"点击产生涟漪并循环切换字母；滑动可借助微风物理让花朵摇曳；通过输入心情来自定义体验，并借助LLM集成生成独特的配色和字母图案。"},"artStyle":{"tag":"abstract floral canvas","text":"Minimalist digital art on a black canvas featuring colorful geometric flower petals, smooth procedural animations, and elegant floating typography.","tagZh":"抽象花卉画布","textZh":"黑色画布上的极简数字艺术，以彩色几何花瓣、流畅的程序化动画和优雅的漂浮文字为特色。"},"mood":{"tag":"serene and therapeutic","text":"Soothing and meditative, characterized by ambient music, soft chime sound effects, and the satisfying visual feedback of blooming petals.","tagZh":"宁静而疗愈","textZh":"舒缓而冥想，以环境音乐、柔和的风铃音效以及花瓣绽放时令人满足的视觉反馈为特色。"},"interaction":{"tag":"pointer ripple and text input","text":"Pointer down and move for ripples and wind effects; text input for real-time letter and mood generation.","tagZh":"指针涟漪与文字输入","textZh":"按下并移动指针产生涟漪和风的效果；通过文字输入实时生成字母和心情。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"0151632a-29be-40ad-8852-d80eb5c9a72b":{"subject":{"tag":"candle crafting","text":"a serene candle-making scene featuring a glass tumbler, various scented oils like lavender and mint, an orchid flower, a wick, and matches set against a rainy background.","tagZh":"蜡烛制作","textZh":"一个宁静的蜡烛制作场景，包含玻璃杯、薰衣草和薄荷等各种香精油、一朵兰花、烛芯和火柴，衬以雨天的背景。"},"gameplay":{"tag":"ASMR simulation","text":"a multi-stage creative simulation where players select wax flavors, hold to pour liquid wax, wait for hardening, drag a wick into place, and strike a match to light the finished candle; an arcade simulation of relaxation.","tagZh":"ASMR模拟","textZh":"一款多阶段的创意模拟，玩家选择蜡的香型，长按倒入液态蜡，等待凝固，将烛芯拖放到位，再划火柴点燃做好的蜡烛；一场关于放松的街机式模拟。"},"artStyle":{"tag":"ethereal illustrated","text":"soft ethereal art style with iridescent textures, glowing light effects, and a dark rainy atmospheric background using illustrative 2D assets and fluid particle physics.","tagZh":"空灵插画","textZh":"柔和空灵的美术风格，具有虹彩质感、发光光效和深色雨天的氛围背景，采用插画式2D素材和流体粒子物理。"},"mood":{"tag":"calm and soothing","text":"deeply relaxing and meditative, characterized by rainy ambience, ethereal spa music, and satisfying visual feedback from blooming flowers and flickering flames.","tagZh":"平静舒缓","textZh":"深度放松而冥想，以雨声氛围、空灵的水疗音乐，以及花朵绽放和火焰摇曳带来的令人满足的视觉反馈为特色。"},"interaction":{"tag":"long press and drag","text":"long press to pour wax, drag and drop for wick placement and match striking, and button clicks for flavor selection.","tagZh":"长按与拖动","textZh":"长按倒蜡，拖放放置烛芯和划火柴，点击按钮选择香型。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"020903b3-020e-4354-a5e2-0ee7a162cd7d":{"subject":{"tag":"woodworking workshop","text":"A rotating vertical wooden log on a workbench, featuring grain textures for Oak, Mahogany, and Birch.","tagZh":"木工工坊","textZh":"工作台上一根旋转的竖直木料，呈现橡木、桃花心木和桦木的纹理质感。"},"gameplay":{"tag":"wood carving simulation","text":"A creative sandbox simulation where the user shapes a rotating block by moving different tools to carve away material; features Gouge, V-tool, and Flat tool options with distinct widths and profiles.","tagZh":"木雕模拟","textZh":"一款创意沙盒模拟，用户通过移动不同工具削除材料来塑造旋转的木块；提供圆凿、V形刀和平口刀等选项，各具不同的宽度和刀廓。"},"artStyle":{"tag":"minimalist 3D","text":"Clean 3D rendering with realistic lighting, soft shadows, and high-quality wood grain textures against a dark, moody background.","tagZh":"极简3D","textZh":"简洁的3D渲染，具有写实的光照、柔和的阴影和高质量的木纹质感，衬以深色、氛围感十足的背景。"},"mood":{"tag":"relaxing zen","text":"Calm and tactile, focusing on the satisfying sensory feedback of carving and the steady rotation of the wood.","tagZh":"放松禅意","textZh":"平静而富有触感，专注于雕刻带来的令人满足的感官反馈和木料的平稳旋转。"},"interaction":{"tag":"drag to carve","text":"Click and drag to move carving tools along the Y-axis; includes UI buttons for tool selection, wood type toggling, and environment reset.","tagZh":"拖动雕刻","textZh":"点击并拖动使雕刻工具沿Y轴移动；包含用于工具选择、木材类型切换和环境重置的UI按钮。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01831efd-85cf-4afc-adff-2fe562eb8523":{"subject":{"tag":"horror corridor garfield","text":"a dark corridor featuring a mysterious garfield figure, ghosts, and cheese bait in a horror-themed setting.","tagZh":"恐怖走廊加菲猫","textZh":"在恐怖主题的场景中，一条黑暗走廊里出现神秘的加菲猫身影、幽灵以及作为诱饵的奶酪。"},"gameplay":{"tag":"multimodal horror sandbox","text":"interactive sandbox where users switch between modes like flashlight, jumpscare, and glitch effects to manipulate a horror video loop; featuring tap and hold triggered visual/audio feedback.","tagZh":"多模式恐怖沙盒","textZh":"互动沙盒，玩家可在手电筒、惊吓、故障特效等模式间切换，以操控循环播放的恐怖视频；点按和长按均可触发视听反馈。"},"artStyle":{"tag":"dark glitch horror","text":"dark and high-contrast aesthetic with neon red accents, glitch video filters, screen shakes, and eerie overlays.","tagZh":"黑暗故障恐怖","textZh":"黑暗高对比度的美术风格，配以霓虹红点缀、故障视频滤镜、屏幕震动和诡异的图层叠加。"},"mood":{"tag":"tense eerie mysterious","text":"tense and eerie atmosphere enhanced by sudden sound effects, pulse animations, and horror-themed interactive elements.","tagZh":"紧张诡异神秘","textZh":"紧张而诡异的氛围，通过突发音效、脉动动画和恐怖主题的互动元素进一步渲染。"},"interaction":{"tag":"tap and hold interaction","text":"pointer-driven interactions where tapping triggers immediate audio-visual responses and holding activates continuous effects like flashlight beams or lasagna rain.","tagZh":"点按与长按互动","textZh":"以指针驱动的互动，点按可触发即时的视听反馈，长按则激活手电筒光束或千层面雨等持续特效。"},"social":{"tag":"single-player","text":"single-player interactive media experience.","tagZh":"单人","textZh":"单人互动媒体体验。"}},"00205eae-8c07-4ce8-8f48-4b9bf3635aa0":{"subject":{"tag":"abstract neon drawing","text":"dynamic glowing neon geometric lines and shapes on a dark canvas","tagZh":"抽象霓虹绘图","textZh":"在黑暗画布上动态发光的霓虹几何线条与形状"},"gameplay":{"tag":"spinning drawing challenge","text":"arcade reaction game where users must draw a shape while the canvas spins with increasing speed; performance is measured by accuracy and duration before release","tagZh":"旋转绘图挑战","textZh":"街机反应游戏，玩家需在画布不断加速旋转时绘制图形；成绩由准确度和松手前的持续时间共同衡量"},"artStyle":{"tag":"cyberpunk neon","text":"minimalist cyberpunk aesthetic with high-contrast cyan glow, heavy motion blur, and a dark obsidian palette","tagZh":"赛博朋克霓虹","textZh":"极简赛博朋克美术风格，配以高对比度的青色辉光、强烈的运动模糊和暗黑曜石般的配色"},"mood":{"tag":"intense addictive","text":"intense and high-pressure with rapid motion and vibrant visual feedback","tagZh":"紧张上瘾","textZh":"紧张而高压，伴随快速运动和鲜艳的视觉反馈"},"interaction":{"tag":"long press drawing","text":"pointer down to begin drawing and spinning, movement to trace shapes, and release to submit the result","tagZh":"长按绘图","textZh":"按下指针开始绘图并旋转，移动以描绘形状，松手即提交结果"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"001087d5-8f6e-49cf-84d0-79f2cf04af07":{"subject":{"tag":"tactile interaction objects","text":"a series of minimalist abstract objects including bubble wrap, alignment sliders, fitting shapes, zippers, light switches, dials, and inflatable balloons.","tagZh":"触感互动物件","textZh":"一系列极简抽象物件，包括气泡膜、对齐滑块、拼合形状、拉链、电灯开关、旋钮和充气气球。"},"gameplay":{"tag":"satisfying micro-interactions","text":"a collection of 10 tactile mini-games focused on physics-based feedback and simple objectives like popping, sliding, wiping, and rotating to achieve a sense of order and completion.","tagZh":"解压微互动","textZh":"一组共10个触感小游戏，专注于基于物理的反馈以及捏破、滑动、擦拭、旋转等简单目标，带来秩序感与完成感。"},"artStyle":{"tag":"minimalist clean pastel","text":"clean minimalist design with a soft pastel and neutral palette, utilizing smooth motion-designed transitions and high-contrast UI elements on a light gray background.","tagZh":"极简清爽马卡龙","textZh":"简洁极简的设计，采用柔和的马卡龙与中性色调，在浅灰背景上运用流畅的动效过渡和高对比度的 UI 元素。"},"mood":{"tag":"satisfying and zen","text":"soothing and zen-like experience focused on sensory satisfaction, gentle audio feedback, and the stress-relieving nature of simple physical tasks.","tagZh":"解压禅意","textZh":"舒缓而禅意的体验，专注于感官上的满足、轻柔的音效反馈以及简单物理操作所带来的减压效果。"},"interaction":{"tag":"multi-gesture touch","text":"varied touch interactions including clicking, horizontal and vertical dragging, scrubbing, long-pressing, and rotational gestures.","tagZh":"多手势触控","textZh":"多样的触控互动，包括点击、水平与垂直拖动、来回滑动、长按以及旋转手势。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"00ba34d4-c923-4b7e-8269-85cdee5c9a61":{"subject":{"tag":"neon physics sandbox","text":"bouncing balls and glowing hand-drawn lines set against a dark, cosmic digital background","tagZh":"霓虹物理沙盒","textZh":"在黑暗的宇宙数字背景上弹跳的小球与发光的手绘线条"},"gameplay":{"tag":"drawing idle clicker","text":"draw lines to bounce falling balls and generate currency; purchase upgrades for more balls, speed, multipliers, and skins; includes a prestige rebirth system for exponential progression","tagZh":"绘线放置点击","textZh":"画线弹开下落的小球以产出货币；购买升级以增加小球数量、速度、倍率和皮肤；含转生系统实现指数级成长"},"artStyle":{"tag":"neon synthwave","text":"minimalist neon aesthetic with high-contrast glowing effects, vibrant secondary colors on dark slate, and floating reward text","tagZh":"霓虹合成波","textZh":"极简霓虹美术风格，配以高对比度的辉光特效、暗石板色上的鲜艳辅色以及漂浮的奖励文字"},"mood":{"tag":"satisfying and addictive","text":"satisfying and rhythmic through physics-based collisions, melodic synth notes, and incremental growth feedback","tagZh":"解压上瘾","textZh":"通过基于物理的碰撞、悦耳的合成音符和渐进式的成长反馈，带来解压且富有节奏感的体验"},"interaction":{"tag":"line drawing","text":"drag to draw static lines that interact with simulated physics; click-based UI for managing upgrades and leaderboard access","tagZh":"画线","textZh":"拖动以绘制与模拟物理互动的静态线条；通过点击式 UI 管理升级并访问排行榜"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a persistent global leaderboard where players sync their maximum wealth and view global rankings","tagZh":"异步竞技","textZh":"异步竞技，设有持久化的全球排行榜，玩家可同步各自的最高财富并查看全球排名"}},"0147c64f-55f8-4360-9331-91f8adc05e89":{"subject":{"tag":"geometric angle drafting","text":"geometric shapes and angles displayed on a circular drafting plane within a dark interface","tagZh":"几何角度绘制","textZh":"在黑暗界面中的圆形绘图平面上显示的几何形状与角度"},"gameplay":{"tag":"precision arcade","text":"replicate specific target angles by dragging a line from a center point; scoring is based on rotational accuracy and proximity to the goal.","tagZh":"精准街机","textZh":"从中心点拖出一条线来复现指定的目标角度；得分取决于旋转的准确度和与目标的接近程度。"},"artStyle":{"tag":"minimalist cyberpunk","text":"minimalist vector aesthetic with high-contrast cyan and pink neon lines over a slate-950 dark background.","tagZh":"极简赛博朋克","textZh":"极简矢量美术风格，在深石板灰背景上呈现高对比度的青色与粉色霓虹线条。"},"mood":{"tag":"zen focus","text":"zen and focused, combining calm background music with the satisfying feedback of precision measurement.","tagZh":"禅意专注","textZh":"禅意而专注，将平静的背景音乐与精准测量所带来的满足反馈相结合。"},"interaction":{"tag":"drag to rotate","text":"pointer-down and drag to rotate the line, with release to confirm the angle selection.","tagZh":"拖动旋转","textZh":"按下指针并拖动以旋转线条，松手即确认所选角度。"},"social":{"tag":"single-player","text":"single-player experience focused on personal score progression and level-based accuracy challenges.","tagZh":"单人","textZh":"单人体验，专注于个人分数的进阶以及分关卡的准确度挑战。"}},"0075f1dc-40ab-448b-ac26-b63442854517":{"subject":{"tag":"neon circuit grid","text":"an abstract grid of interconnected pipe and line segments including I, L, T, and X shaped connectors set against a dark void","tagZh":"霓虹电路网格","textZh":"在黑暗虚空中由相互连接的管道与线段组成的抽象网格，包含 I、L、T、X 形连接件"},"gameplay":{"tag":"rotational pipe puzzle","text":"tap to rotate tiles to align connections and form a continuous closed circuit without any loose ends; features procedural level scaling and progression","tagZh":"旋转接管解谜","textZh":"点击旋转方块以对齐接口，形成连续闭合、没有断头的回路；含程序化的关卡难度递增与进程"},"artStyle":{"tag":"minimalist neon cyber","text":"minimalist high-contrast aesthetic with neon cyan glowing paths on a deep black background and smooth rotation animations","tagZh":"极简霓虹赛博","textZh":"极简高对比度美术风格，深黑背景上呈现霓虹青色的发光路径以及流畅的旋转动画"},"mood":{"tag":"zen and focused","text":"calm and zen-like atmosphere with soothing background music and satisfying visual glow feedback","tagZh":"禅意专注","textZh":"平静而禅意的氛围，配以舒缓的背景音乐和令人满足的视觉辉光反馈"},"interaction":{"tag":"tap to rotate","text":"click or tap to rotate individual tiles with haptic vibration feedback on each successful turn","tagZh":"点击旋转","textZh":"点击或点按以旋转单个方块，每次成功转动都伴有触感震动反馈"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"018e30e0-a4b4-4073-82e8-b41ecc12724a":{"subject":{"tag":"retro-future roller coaster","text":"a pink futuristic ride cart traveling on a winding neon track through a synthwave-inspired outer space environment featuring a grid-patterned ground and a glowing background sun.","tagZh":"复古未来过山车","textZh":"一辆粉色的未来感车厢在蜿蜒的霓虹轨道上行驶，穿越合成波风格的外太空环境，背景是网格状地面和发光的太阳。"},"gameplay":{"tag":"speed-management survival","text":"arcade speed-management survival where the player boosts to increase velocity; maintaining excessive speed during sharp curves results in a crash, requiring the player to balance momentum and safety to achieve maximum distance.","tagZh":"速度管理生存","textZh":"街机式速度管理生存游戏，玩家通过加速提升速度；在急弯中保持过高速度会导致撞毁，玩家需在动量与安全之间权衡以跑出最远距离。"},"artStyle":{"tag":"synthwave vaporwave","text":"3D synthwave aesthetic with neon cyan and hot pink highlights, glowing grid textures, starry backgrounds, and a stylized retro HUD.","tagZh":"合成波蒸汽波","textZh":"3D 合成波美术风格，配以霓虹青和亮粉的高光、发光的网格纹理、星空背景以及风格化的复古 HUD。"},"mood":{"tag":"intense satisfying","text":"intense and satisfying, characterized by high-speed motion blur, screen shake, and rhythmic synthwave audio that responds to velocity.","tagZh":"紧张爽快","textZh":"紧张而爽快，以高速运动模糊、屏幕震动以及随速度变化的节奏感合成波音乐为特色。"},"interaction":{"tag":"hold to boost","text":"long press or spacebar keydown to boost speed, releasing the input to decelerate for curves.","tagZh":"长按加速","textZh":"长按或按下空格键以加速，松开则减速以应对弯道。"},"social":{"tag":"single-player","text":"single-player experience focused on personal high-score distance tracking.","tagZh":"单人","textZh":"单人体验，专注于追踪个人最高距离纪录。"}},"00753557-2eba-4298-baae-879261321eb2":{"subject":{"tag":"expressive emoji endurance","text":"a series of expressive emoji characters that react and transform during an endurance challenge","tagZh":"表情丰富的 emoji 耐力赛","textZh":"一系列表情丰富的 emoji 角色，在耐力挑战过程中会做出反应并发生变化"},"gameplay":{"tag":"hold-to-endure arcade","text":"precision endurance challenge where you long-press to hold your breath; features increasing difficulty phases, screen shaking, and taunting insults the longer you hold","tagZh":"长按坚持街机","textZh":"精准的耐力挑战，通过长按来憋气；坚持越久，难度阶段越高，屏幕震动越强，嘲讽也越激烈"},"artStyle":{"tag":"expressive meme-cartoon","text":"vibrant cartoon style using expressive emojis, dynamic background color shifts, and high-energy motion shaking effects","tagZh":"夸张梗图卡通","textZh":"鲜艳的卡通风格，运用表情丰富的 emoji、动态变换的背景色以及充满活力的震动特效"},"mood":{"tag":"silly and intense","text":"a mix of humorous meme-style comedy and stressful intensity through screen shake and aggressive taunts","tagZh":"搞笑又紧张","textZh":"融合了梗图式的幽默喜剧与由屏幕震动和激烈嘲讽带来的压力紧张感"},"interaction":{"tag":"long press endurance","text":"long press and hold to sustain the action, release to stop; includes haptic vibration feedback and click controls for navigation","tagZh":"长按耐力","textZh":"长按并保持以持续动作，松手即停止；含触感震动反馈以及用于导航的点击操作"},"social":{"tag":"asynchronous competition","text":"asynchronous competition featuring a global leaderboard for the longest hold times and best personal scores","tagZh":"异步竞技","textZh":"异步竞技，设有全球排行榜，记录最长坚持时间和个人最佳成绩"}},"012ea316-6e04-4ce8-87cd-45102bf3aefb":{"subject":{"tag":"sneaky museum cat","text":"A cat attempting to sneak past a museum guard toward a fish bowl goal.","tagZh":"潜行博物馆的猫","textZh":"一只猫试图悄悄溜过博物馆守卫，前往作为目标的鱼缸。"},"gameplay":{"tag":"red-light green-light","text":"Hold to move forward and release to stop; arcade stealth where players must freeze when the guard looks to avoid increasing a suspicion meter.","tagZh":"一二三木头人","textZh":"长按前进、松手停下的街机潜行玩法，守卫回头时玩家必须停住不动，以免可疑度上升。"},"artStyle":{"tag":"stylized museum setting","text":"2D canvas-rendered museum environment featuring animated character sprites and a high-contrast dark palette with neon UI accents.","tagZh":"风格化博物馆场景","textZh":"以 2D 画布渲染的博物馆环境，包含带动画的角色精灵、高对比度的暗色调以及霓虹点缀的 UI。"},"mood":{"tag":"tense sneaky comedy","text":"Tense and sneaky with humorous stakes, supported by alert sounds and vibration feedback during detection.","tagZh":"紧张潜行喜剧","textZh":"紧张而潜行，带有幽默的博弈感，被发现时以警报音和震动反馈加以烘托。"},"interaction":{"tag":"long press movement","text":"Long press to move forward and release to stay still, featuring haptic vibration alerts during the guard's warning phase.","tagZh":"长按移动","textZh":"长按前进、松手保持静止，在守卫的警示阶段会有触感震动提醒。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"00a07b40-085a-4b08-b33d-cdae9bd8eabc":{"subject":{"tag":"emoji tag arena","text":"a dynamic field populated by various emoji entities including faces, food, and objects, featuring a runner character","tagZh":"emoji 抓人竞技场","textZh":"一个动态场地，布满了各种 emoji 实体，包括表情、食物和物件，并有一个奔跑的角色"},"gameplay":{"tag":"arcade tag simulation","text":"a sandbox game of tag where the player or emojis can be 'it'; emojis flee from the tagged entity while the 'it' entity chases others to transfer the status; features increasing movement speeds over time","tagZh":"街机抓人模拟","textZh":"一款抓人沙盒游戏，玩家或 emoji 都可能成为“鬼”；被抓的 emoji 会逃离，而“鬼”会追逐他人以转移身份；移动速度随时间不断加快"},"artStyle":{"tag":"emoji-based minimalist","text":"minimalist dark background with large background typography, featuring high-fidelity emoji sprites and red glowing indicators for the active 'it' status","tagZh":"emoji 极简风","textZh":"极简的黑暗背景配以大号背景文字，采用高保真的 emoji 精灵，并用红色辉光标示当前的“鬼”身份"},"mood":{"tag":"playful and frantic","text":"playful and energetic, with a sense of escalating urgency as entity movement speed increases over time","tagZh":"欢乐又慌乱","textZh":"欢乐而充满活力，随着实体移动速度随时间加快，紧迫感也不断升级"},"interaction":{"tag":"pointer-follow movement","text":"pointer move and down events to set the runner's target destination, with the character continuously moving toward the last touched location","tagZh":"指针跟随移动","textZh":"通过指针的移动和按下事件来设定奔跑者的目标位置，角色会持续朝最后触碰的位置移动"},"social":{"tag":"single-player","text":"single-player experience against AI-controlled emoji entities that react to the player's proximity and status","tagZh":"单人","textZh":"单人体验，对抗由 AI 控制的 emoji 实体，它们会根据玩家的距离和身份做出反应"}},"013a54b7-1d49-4e72-bdad-bee293b9c170":{"subject":{"tag":"harmonic pendulums","text":"multiple groups of synchronized pendulums swinging from a fixed anchor point against a dark background","tagZh":"谐波摆","textZh":"在黑暗背景下，多组同步的钟摆从固定的锚点垂下摆动"},"gameplay":{"tag":"physics sandbox","text":"drag and release to create groups of pendulums with varying lengths and periods; observe wave patterns and harmonic motion based on gravity physics","tagZh":"物理沙盒","textZh":"拖动并松手即可生成不同长度和周期的钟摆组；观察基于重力物理的波形图案与谐波运动"},"artStyle":{"tag":"neon generative","text":"minimalist neon aesthetic with luminous colored trails, additive blending, and motion blur on a black canvas","tagZh":"霓虹生成艺术","textZh":"极简霓虹美术风格，在黑色画布上呈现发光的彩色轨迹、加法混合和运动模糊"},"mood":{"tag":"mesmerizing ambient","text":"soothing and hypnotic, featuring ambient background music and visually satisfying mathematical patterns","tagZh":"迷人氛围感","textZh":"舒缓而催眠，配以氛围背景音乐和令人赏心悦目的数学图案"},"interaction":{"tag":"drag and release","text":"drag the pointer to set the initial displacement and release to spawn pendulum waves; includes clear and reset buttons","tagZh":"拖动松手","textZh":"拖动指针以设定初始位移，松手即生成摆动波；含清除和重置按钮"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01fa2dbb-23f0-40dd-9401-d2c49cb77a4e":{"subject":{"tag":"zen fluid garden","text":"an interactive fluid simulation set in a dark meditative space featuring abstract colorful dye flows and a taijitu peace indicator.","tagZh":"禅意流体花园","textZh":"一款设定在黑暗冥想空间中的互动流体模拟，包含抽象多彩的染料流动以及一个太极图形的平和指示器。"},"gameplay":{"tag":"interactive sandbox","text":"a calming sandbox where pointer movement generates fluid swirls to fill a peace meter and accumulate score; includes a passive decay mechanic requiring continuous movement to maintain high tranquility levels.","tagZh":"互动沙盒","textZh":"一款令人平静的沙盒，指针移动会生成流体漩涡以填满平和值并累积分数；含被动衰减机制，需持续移动才能维持较高的宁静度。"},"artStyle":{"tag":"glowing neon fluid","text":"a dark, high-contrast aesthetic using neon fluid dynamics, bloom effects, sunrays, and a minimalist UI with monospaced typography.","tagZh":"发光霓虹流体","textZh":"黑暗、高对比度的美术风格，运用霓虹流体动态、泛光特效、光束以及采用等宽字体的极简 UI。"},"mood":{"tag":"serene and meditative","text":"tranquil and relaxing, reinforced by ambient zen music, chime sound effects, and slow-paced visual feedback.","tagZh":"宁静冥想","textZh":"宁静而放松，通过氛围禅意音乐、风铃音效和舒缓的视觉反馈进一步增强。"},"interaction":{"tag":"drag and swipe","text":"drag and swipe movements to disturb the fluid surface, with chime feedback on release and auto-saving progress via pointer events.","tagZh":"拖动与滑动","textZh":"通过拖动和滑动来扰动流体表面，松手时有风铃反馈，并借助指针事件自动保存进度。"},"social":{"tag":"asynchronous competition","text":"asynchronous competition through a global 'Zen Masters' leaderboard ranking users by their accumulated total peace score.","tagZh":"异步竞技","textZh":"通过全球“禅意大师”排行榜进行异步竞技，按玩家累积的总平和分数进行排名。"}},"01db5bcc-f1ba-45ce-8168-5f52818c0e9a":{"subject":{"tag":"zen rice pouring","text":"rice grains, a wooden bowl, and various glass vessels including flasks and bulbous bottles set on a wooden table","tagZh":"禅意倒米","textZh":"木桌上摆放着米粒、一只木碗以及各种玻璃容器，包括细颈瓶和圆肚瓶"},"gameplay":{"tag":"precision pouring physics","text":"tilt a wooden bowl to pour rice grains into different bottle shapes; achieve a target fill level of 85% to progress through a series of containers in a physics-based simulation","tagZh":"精准倾倒物理","textZh":"倾斜木碗将米粒倒入不同形状的瓶子；在基于物理的模拟中，需达到 85% 的目标填充度才能通关一系列容器"},"artStyle":{"tag":"warm minimalist","text":"clean minimalist aesthetic with warm wood textures, cream-colored grains, and semi-transparent glass rendering on a 2D canvas","tagZh":"温暖极简","textZh":"简洁极简的美术风格，在 2D 画布上呈现温暖的木质纹理、奶油色的米粒以及半透明的玻璃渲染"},"mood":{"tag":"calm soothing","text":"relaxing and zen-like, featuring gentle background music, satisfying grain physics, and haptic feedback for a tactile experience","tagZh":"平静舒缓","textZh":"放松而禅意，配以轻柔的背景音乐、令人满足的米粒物理效果以及带来触感体验的震动反馈"},"interaction":{"tag":"drag to tilt","text":"pointer drag to move and tilt the bowl horizontally; vibration feedback triggers when grains hit the bottle or a level is completed","tagZh":"拖动倾斜","textZh":"拖动指针以水平移动并倾斜木碗；当米粒撞到瓶子或关卡完成时会触发震动反馈"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"02154d23-e1c6-4b31-ba0d-d608d062a10d":{"subject":{"tag":"personal smartphone simulation","text":"a virtual smartphone belonging to a teenager with contacts including family, friends, a crush, a bully, and a mysterious stalker","tagZh":"个人智能手机模拟","textZh":"一部属于青少年的虚拟智能手机，联系人包括家人、朋友、暗恋对象、霸凌者和一个神秘的跟踪者"},"gameplay":{"tag":"interactive roleplay lifestyle","text":"explore a simulated mobile interface to interact with characters via AI-powered messaging; features include unlocking the phone with a passcode, using a functional camera, viewing fictional social apps, checking weather, and reading personal notes","tagZh":"互动角色扮演生活模拟","textZh":"探索模拟手机界面，通过 AI 消息与角色互动；功能包括用密码解锁手机、使用可用的相机、浏览虚构社交应用、查看天气以及阅读个人笔记"},"artStyle":{"tag":"modern mobile UI","text":"sleek contemporary smartphone interface with colorful app icons, dynamic lock screens, blurred translucency effects, and custom character avatars","tagZh":"现代手机 UI","textZh":"时尚现代的智能手机界面，配有多彩的应用图标、动态锁屏、模糊半透明效果和自定义角色头像"},"mood":{"tag":"relatable and dramatic","text":"socially focused and dramatic, ranging from cheerful family chats to tense interactions with a bully or stalker","tagZh":"贴近生活且戏剧化","textZh":"以社交为核心、充满戏剧张力，从欢快的家庭聊天到与霸凌者或跟踪者的紧张互动皆有涵盖"},"interaction":{"tag":"touchscreen camera navigation","text":"camera for real-time photography, vibration feedback, and tap-based navigation through a multi-app virtual OS including a numeric keypad and text input","tagZh":"触屏相机导航","textZh":"支持实时拍摄的相机、震动反馈，以及在多应用虚拟操作系统中的点触导航，包含数字键盘和文本输入"},"social":{"tag":"single-player","text":"single-player experience using an AI-driven chat system to simulate social interactions with diverse fictional NPCs","tagZh":"单人游戏","textZh":"单人体验，利用 AI 驱动的聊天系统模拟与各种虚构 NPC 的社交互动"}},"0222c102-1847-4186-80ef-959d19a087de":{"subject":{"tag":"neon glow physics orb","text":"a glowing neon orb navigating a dark cybernetic environment filled with dynamic gravity fields, geometric obstacles, and glowing target goals.","tagZh":"霓虹发光物理光球","textZh":"一颗发光的霓虹光球在充满动态重力场、几何障碍和发光目标点的暗黑赛博环境中穿行。"},"gameplay":{"tag":"drawing physics puzzle","text":"draw custom neon lines to guide a falling orb into a goal; utilize specialized line types including bouncy, sticky, and speed boosters across levels with shifting gravity and dynamic camera zoom.","tagZh":"绘线物理解谜","textZh":"绘制自定义霓虹线条引导下落的光球进入目标；在重力变化和动态镜头缩放的关卡中运用弹性、黏性和加速等特殊线条类型。"},"artStyle":{"tag":"cyberpunk neon vector","text":"high-contrast cyberpunk aesthetic featuring glowing vector lines, neon magenta and cyan palettes, particle explosion effects, and minimalist geometric shapes over a black background.","tagZh":"赛博朋克霓虹矢量","textZh":"高对比度的赛博朋克美学，以发光矢量线条、霓虹品红与青色配色、粒子爆炸效果和黑色背景上的极简几何形状为特色。"},"mood":{"tag":"intense satisfying arcade","text":"intense and satisfying arcade energy with rhythmic synth audio, rewarding haptic-style visual feedback, and a sense of high-velocity momentum.","tagZh":"激烈爽快的街机感","textZh":"激烈而爽快的街机氛围，配有律动的合成器音效、令人满足的类触觉视觉反馈和高速动感。"},"interaction":{"tag":"drag to draw","text":"drag or swipe to draw physics-enabled lines on a canvas; featuring specialized buttons for line-type selection and menu navigation via clicks.","tagZh":"拖动绘线","textZh":"拖动或滑动在画布上绘制带物理效果的线条；配有用于选择线条类型的专用按钮，并通过点击进行菜单导航。"},"social":{"tag":"asynchronous competition","text":"asynchronous competition with a global leaderboard tracking total levels cleared and user rankings.","tagZh":"异步竞技","textZh":"异步竞技，配有全球排行榜，记录通关总数和用户排名。"}},"01552427-f971-4fd8-a2a0-426fd40fe650":{"subject":{"tag":"geometric fill board","text":"a grid-based canvas of empty geometric outlines such as hearts, stars, circles, and hexagons that populate the screen","tagZh":"几何填色画板","textZh":"一块网格画布，屏幕上布满爱心、星星、圆形和六边形等空白几何轮廓"},"gameplay":{"tag":"satisfying swipe filling","text":"continuous pointer drag to fill shapes with color; arcade-style progression where players must fill a high volume of shapes to complete levels and trigger celebratory confetti","tagZh":"爽快滑动填色","textZh":"持续拖动指针为形状填色；街机式进程，玩家需填满大量形状以完成关卡并触发庆祝彩带"},"artStyle":{"tag":"pastel soft-aesthetic","text":"minimalist and clean aesthetic with pastel color palettes, soft rounded shapes, and a bright white-pink backdrop","tagZh":"柔和马卡龙美学","textZh":"极简干净的美学，配有柔和的马卡龙配色、圆润的形状和明亮的白粉色背景"},"mood":{"tag":"satisfying and zen","text":"soothing and addictive feeling enhanced by pentatonic pop sound effects and smooth visual feedback","tagZh":"解压且禅意","textZh":"舒缓而令人上瘾的体验，由五声音阶的流行音效和流畅的视觉反馈增强"},"interaction":{"tag":"drag and swipe","text":"continuous drag or swipe movement over the screen to interact with multiple objects in a single stroke","tagZh":"拖动与滑动","textZh":"在屏幕上持续拖动或滑动，一笔即可与多个对象互动"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"00185f50-2b84-4db2-8146-51665f7ac1af":{"subject":{"tag":"Undertale-style soul combat","text":"a heart-shaped soul entity navigating a small square arena surrounded by patterns of white bones and glowing energy blasters","tagZh":"《Undertale》风格灵魂战斗","textZh":"一个心形灵魂实体在被白骨图案和发光能量炮环绕的小方形竞技场中穿行"},"gameplay":{"tag":"bullet-hell survival arcade","text":"avoidance-based bullet-hell where players dodge patterns of bones and lasers within a confined box; features soul color mechanics that change movement rules like gravity-based jumping or movement-dependent damage","tagZh":"弹幕生存街机","textZh":"以躲避为核心的弹幕游戏，玩家在封闭方框内闪避骨头和激光的弹幕；灵魂颜色机制会改变移动规则，如基于重力的跳跃或依赖移动的伤害判定"},"artStyle":{"tag":"retro high-contrast pixel aesthetic","text":"minimalist high-contrast visuals with white and neon entities against a black background, utilizing glowing edges, screen shake effects, and a monospace UI","tagZh":"复古高对比像素美学","textZh":"极简高对比的视觉效果，黑色背景上的白色与霓虹实体，运用发光边缘、屏幕震动效果和等宽字体 UI"},"mood":{"tag":"intense rhythmic precision","text":"tense and focused, driven by retro square-wave sound effects and rhythmic patterns of high-stakes dodging","tagZh":"紧张律动的精准操作","textZh":"紧张而专注，由复古方波音效和高风险闪避的律动节奏所驱动"},"interaction":{"tag":"touch or keyboard dodging","text":"arrow keys for directional movement and jumping; touch and swipe controls optimized for mobile dodging within a canvas arena","tagZh":"触屏或键盘闪避","textZh":"方向键用于方向移动和跳跃；针对移动端优化的触屏和滑动控制，用于在画布竞技场内闪避"},"social":{"tag":"single-player","text":"single-player experience focused on survival time tracking and high-score endurance","tagZh":"单人游戏","textZh":"单人体验，侧重于生存时间记录和高分耐力挑战"}},"00bf8bdf-7b77-4679-9543-f538cd43eed7":{"subject":{"tag":"magic mandala creator","text":"a creative digital canvas featuring a kaleidoscope mirror effect and glowing neon patterns against a dark cosmic background","tagZh":"魔法曼陀罗创作器","textZh":"一块创意数字画布，在暗黑宇宙背景上呈现万花筒镜像效果和发光的霓虹图案"},"gameplay":{"tag":"creative sandbox","text":"interactive drawing sandbox where user strokes are mirrored across multiple axes to create symmetrical mandalas; features a synth-based generative audio loop that plays notes based on drawing distance","tagZh":"创意沙盒","textZh":"互动绘画沙盒，用户的笔触沿多个轴镜像以创造对称的曼陀罗；配有基于合成器的生成式音频循环，根据绘制距离演奏音符"},"artStyle":{"tag":"neon glitch art","text":"dark, high-contrast aesthetic featuring glowing neon HSL color cycles, radial symmetry, and vibrant shadow-blurred strokes on a cosmic gradient backdrop","tagZh":"霓虹故障艺术","textZh":"暗黑高对比的美学，以发光的霓虹 HSL 色彩循环、径向对称，以及宇宙渐变背景上鲜艳的阴影模糊笔触为特色"},"mood":{"tag":"relaxing and mesmerizing","text":"relaxing and soothing tone reinforced by harmonious pentatonic synth notes and satisfying symmetrical visual feedback","tagZh":"放松且迷人","textZh":"放松舒缓的基调，由和谐的五声音阶合成器音符和令人满足的对称视觉反馈所强化"},"interaction":{"tag":"drag and draw","text":"drag and pointer-move interaction for drawing, with button controls for clearing the canvas and downloading the artwork","tagZh":"拖动与绘制","textZh":"通过拖动和指针移动进行绘制，并配有用于清空画布和下载作品的按钮控制"},"social":{"tag":"single-player","text":"single-player creative experience with local export functionality","tagZh":"单人游戏","textZh":"单人创作体验，具备本地导出功能"}},"003362a8-3e7b-4724-a6ce-74525a20e534":{"subject":{"tag":"customizable character avatar","text":"a human avatar with customizable traits including gender, skin tone, hairstyle, hair color, eye shape, eye color, and a variety of outfits such as suits, dresses, and shirts with accessories.","tagZh":"可自定义角色形象","textZh":"一个可自定义特征的人物形象，包括性别、肤色、发型、发色、眼型、眼睛颜色，以及西装、连衣裙和衬衫等多种服装与配饰。"},"gameplay":{"tag":"interactive character creator","text":"a step-by-step selection process to build a character; users answer a series of multiple-choice questions about appearance and clothing, with a live-updating preview that generates a final result.","tagZh":"互动角色创建器","textZh":"分步选择流程来打造角色；用户回答一系列关于外貌和服装的多选题，并配有实时更新的预览，最终生成结果。"},"artStyle":{"tag":"playful vector flat art","text":"clean, flat vector illustration style with soft gradients and rounded edges; features a vibrant pink and purple pastel palette with high-contrast UI elements and animated transitions.","tagZh":"俏皮的矢量扁平艺术","textZh":"简洁的扁平矢量插画风格，配有柔和渐变和圆润边缘；以鲜艳的粉紫马卡龙配色、高对比度 UI 元素和动画过渡为特色。"},"mood":{"tag":"cheerful and creative","text":"uplifting, creative, and satisfying, supported by happy background music and bubbly pop sound effects during customization.","tagZh":"欢快且富有创意","textZh":"振奋、有创意且令人满足，在自定义过程中配有欢快的背景音乐和活泼的流行音效。"},"interaction":{"tag":"click and text input","text":"primary interaction via button clicks for selection and navigation, featuring a text input field for additional custom details.","tagZh":"点击与文本输入","textZh":"主要通过按钮点击进行选择和导航，并配有用于补充自定义细节的文本输入框。"},"social":{"tag":"single-player","text":"single-player offline experience focused on individual character design and creation.","tagZh":"单人游戏","textZh":"单人离线体验，侧重于个人角色设计与创作。"}},"003aaee1-d4f7-459d-94f9-f8cf6f97daaf":{"subject":{"tag":"neon physics particles","text":"bouncing balls and player-created walls within a neon cybernetic grid environment","tagZh":"霓虹物理粒子","textZh":"在霓虹赛博网格环境中弹跳的小球和玩家创建的墙壁"},"gameplay":{"tag":"physics idle clicker","text":"earn revenue by bouncing balls off screen edges and player-drawn walls; use funds to buy upgrades like increased ball count, movement speed, and bounce value in an incremental loop","tagZh":"物理放置点击","textZh":"通过小球在屏幕边缘和玩家绘制的墙壁上弹跳来赚取收益；在递增循环中用资金购买升级，如增加小球数量、移动速度和弹跳价值"},"artStyle":{"tag":"cyberpunk neon minimalism","text":"minimalist cyberpunk aesthetic featuring neon cyan and magenta glows, high-contrast dark backgrounds, grid overlays, and trailing particle effects","tagZh":"赛博朋克霓虹极简","textZh":"极简的赛博朋克美学，以霓虹青色与品红光晕、高对比暗色背景、网格叠加和拖尾粒子效果为特色"},"mood":{"tag":"satisfying rhythmic addictive","text":"satisfying and rhythmic, driven by the persistent pinging of bounces and the rapid accumulation of currency in a high-tech atmosphere","tagZh":"爽快律动且上瘾","textZh":"爽快而富有律动，由持续的弹跳叮当声和高科技氛围中货币的快速累积所驱动"},"interaction":{"tag":"drag and click drawing","text":"drag to draw permanent lines that redirect ball physics, with click-based navigation for the upgrade store","tagZh":"拖动与点击绘制","textZh":"拖动绘制永久线条以改变小球的物理运动方向，并通过点击导航升级商店"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01d3f0ba-7762-44a9-88b1-2b4a5a5da98c":{"subject":{"tag":"neon math bubbles","text":"falling numerical bubbles and mathematical operator symbols in a neon cyber-styled digital space.","tagZh":"霓虹数学泡泡","textZh":"在霓虹赛博风格的数字空间中下落的数字泡泡和数学运算符号。"},"gameplay":{"tag":"mental math arcade","text":"tap falling numbers and operators to perform real-time arithmetic, aiming to reach exactly sixty-seven without exceeding it; arcade-style precision calculation and score chasing.","tagZh":"心算街机","textZh":"点击下落的数字和运算符进行实时运算，目标是恰好达到六十七且不超过；街机式的精准计算与刷分玩法。"},"artStyle":{"tag":"cyberpunk neon","text":"high-contrast cyberpunk aesthetic featuring glowing neon outlines, vibrant cyan and magenta hues, dark backgrounds, and particle burst effects.","tagZh":"赛博朋克霓虹","textZh":"高对比度的赛博朋克美学，以发光的霓虹轮廓、鲜艳的青色与品红色调、暗色背景和粒子爆发效果为特色。"},"mood":{"tag":"intense satisfying","text":"intense and fast-paced mental challenge with satisfying tactile feedback from popping bubbles and neon visual flashes.","tagZh":"激烈爽快","textZh":"激烈而快节奏的脑力挑战，配有戳破泡泡的爽快触感反馈和霓虹视觉闪光。"},"interaction":{"tag":"tap timing","text":"primary tap and click inputs to interact with falling objects, requiring precise timing and quick mental processing.","tagZh":"点击时机","textZh":"主要通过点触和点击与下落物体互动，需要精准的时机把握和快速的心算。"},"social":{"tag":"single-player","text":"single-player experience focused on personal high score progression.","tagZh":"单人游戏","textZh":"单人体验，侧重于个人高分进阶。"}},"012c7a2b-5b55-480a-b083-fa18a68d3b35":{"subject":{"tag":"backyard ninja cat","text":"A ninja-like cat character attempting to steal a bone from a backyard guarded by a large sleeping dog.","tagZh":"后院忍者猫","textZh":"一只忍者般的猫角色，试图从一只大狗看守的后院偷走骨头，而这只大狗正在沉睡。"},"gameplay":{"tag":"red-light green-light","text":"Red-light green-light arcade loop; hold to move forward when the dog is sleeping and release before it wakes up to avoid detection; reaching the bone wins the level.","tagZh":"一二三木头人","textZh":"一二三木头人式的街机循环；狗睡觉时按住前进，在它醒来前松手以免被发现；抵达骨头即通关。"},"artStyle":{"tag":"colorful cartoon","text":"Bright, colorful 2D cartoon style with a backyard setting, featuring animated character sprites, high-contrast UI overlays, and a progress bar.","tagZh":"多彩卡通","textZh":"明亮多彩的 2D 卡通风格，以后院为场景，配有动画角色精灵、高对比度 UI 叠加层和进度条。"},"mood":{"tag":"tense and playful","text":"Sneaky and tense due to unpredictable timing, punctuated by playful sound effects like snoring, meowing, and barking.","tagZh":"紧张而俏皮","textZh":"因不可预测的时机而潜行紧张，其间穿插着打鼾、喵叫和犬吠等俏皮音效。"},"interaction":{"tag":"hold and release","text":"Hold to move and release to stop, with vibration feedback for success and failure events.","tagZh":"按住与松手","textZh":"按住移动、松手停止，并在成功和失败事件中提供震动反馈。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01773289-ad60-4b55-a8f5-39b911f267de":{"subject":{"tag":"chladni plate simulation","text":"a physics-based simulation of Chladni resonance patterns where particles respond to acoustic vibrations on square, circular, and triangular geometric plates.","tagZh":"克拉尼板模拟","textZh":"基于物理的克拉尼共振图案模拟，粒子在方形、圆形和三角形几何板上响应声学振动。"},"gameplay":{"tag":"acoustic resonance sandbox","text":"interactive sandbox centered on wave interference; users manipulate frequency through horizontal movement and toggle plate shapes to visualize changing nodal patterns and particle distributions.","tagZh":"声学共振沙盒","textZh":"以波的干涉为核心的互动沙盒；用户通过水平移动调节频率并切换板形，以可视化不断变化的节点图案和粒子分布。"},"artStyle":{"tag":"minimalist dark generative","text":"minimalist aesthetic with high-density light particles against a dark void; features smooth morphing geometric outlines and glowing radial highlights.","tagZh":"极简暗色生成艺术","textZh":"极简美学，在暗黑虚空中呈现高密度的光粒子；以平滑变形的几何轮廓和发光的径向高光为特色。"},"mood":{"tag":"meditative and scientific","text":"calm, meditative, and sophisticated, blending scientific visualization with atmospheric drone synthesis.","tagZh":"冥想且科学","textZh":"宁静、冥想而精致，将科学可视化与氛围感的持续合成音融为一体。"},"interaction":{"tag":"drag and click","text":"horizontal drag to adjust resonance frequency, click or tap to cycle plate shapes, and hover to reveal hidden nodal structures.","tagZh":"拖动与点击","textZh":"水平拖动以调节共振频率，点击或点触以循环切换板形，悬停以显示隐藏的节点结构。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01205ec3-c2d1-4f1f-a287-8bb3896adc58":{"subject":{"tag":"pelican snack collection","text":"a pelican with a flexible elastic pouch catching various falling seafood including fish, shrimp, crabs, and specialty items like chili and ice","tagZh":"鹈鹕接食","textZh":"一只鹈鹕用其柔韧的弹性喉囊接住各种落下的海鲜，包括鱼、虾、螃蟹，以及辣椒和冰块等特殊物品"},"gameplay":{"tag":"physics-based collection","text":"control a pelican to catch falling items in a physics-enabled pouch; stretch the pouch to slingshot items or release to swallow them, triggering status effects like freezing, heat, or weight-based sagging","tagZh":"基于物理的接取","textZh":"操控鹈鹕用带物理效果的喉囊接住落下的物品；拉伸喉囊以弹射物品或松开以吞下它们，从而触发冰冻、灼热或因重量下坠等状态效果"},"artStyle":{"tag":"vibrant cartoon vector","text":"clean 2D vector-style cartoon art with a bright sky-blue palette, bold outlines, and smooth physics-driven animations for the elastic pouch","tagZh":"鲜艳卡通矢量","textZh":"简洁的 2D 矢量卡通美术，配有明亮的天蓝色调、粗犷的轮廓，以及弹性喉囊流畅的物理驱动动画"},"mood":{"tag":"silly and satisfying","text":"cheerful and satisfying with comical reactions, bouncy physical feedback, and a whimsical aquatic atmosphere","tagZh":"搞笑且爽快","textZh":"欢快而爽快，配有滑稽的反应、弹性十足的物理反馈和异想天开的水生氛围"},"interaction":{"tag":"drag and release","text":"drag to move the pelican and stretch the pouch, then release to trigger physics-based launching or swallowing actions","tagZh":"拖动与松开","textZh":"拖动移动鹈鹕并拉伸喉囊，然后松开以触发基于物理的弹射或吞咽动作"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01549b65-f3f2-4b57-a486-939d91dfc730":{"subject":{"tag":"vibrant bouncing physics balls","text":"multiple colored physics-driven circular entities within a bounded screen area","tagZh":"鲜艳弹跳物理球","textZh":"在有边界的屏幕区域内多个彩色的物理驱动圆形实体"},"gameplay":{"tag":"physics ball-splitting sandbox","text":"tap balls to trigger a splitting mechanic where one large entity divides into four smaller ones; features gravity-based physics, elastic collisions, and a population counter.","tagZh":"物理分裂球沙盒","textZh":"点击小球触发分裂机制，一个大实体分裂成四个较小的；配有基于重力的物理、弹性碰撞和数量计数器。"},"artStyle":{"tag":"minimalist flat design","text":"minimalist clean canvas with a light slate background, high-contrast flat-colored shapes, and a large background numeric display.","tagZh":"极简扁平设计","textZh":"极简干净的画布，配有浅石板灰背景、高对比度的扁平色块，以及大号的背景数字显示。"},"mood":{"tag":"satisfying and playful","text":"satisfying and playful with responsive audio feedback and high-energy physics movements.","tagZh":"爽快且俏皮","textZh":"爽快而俏皮，配有灵敏的音频反馈和充满活力的物理运动。"},"interaction":{"tag":"tap-to-split","text":"pointer down interaction to select and split physics objects on a touch-optimized canvas.","tagZh":"点击分裂","textZh":"在触屏优化的画布上通过按下指针来选择并分裂物理对象。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人游戏","textZh":"单人游戏"}},"01dc1ebf-f7cf-4185-a07d-e65e3fdcdc2b":{"subject":{"tag":"interactive particle image","text":"a collection of thousands of colorful particles forming an image that reacts to user presence","tagZh":"互动粒子图像","textZh":"由数千个彩色粒子组成、会对用户存在做出反应的图像"},"gameplay":{"tag":"particle physics sandbox","text":"interactive physics simulation where particles scatter away from the pointer and autonomously return to their original image positions; includes an option to upload custom images for reconstruction","tagZh":"粒子物理沙盒","textZh":"互动物理模拟，粒子会从指针处四散并自主返回原始图像位置；包含上传自定义图像进行重建的选项"},"artStyle":{"tag":"generative particle art","text":"minimalist black background with high-density generative particles that maintain the color and shape of the source image in a digital mosaic style","tagZh":"生成式粒子艺术","textZh":"极简的黑色背景，配有高密度的生成式粒子，以数字马赛克风格保持源图像的颜色和形状"},"mood":{"tag":"satisfying and ethereal","text":"relaxing and satisfying, featuring smooth motion, magical background music, and sparkling sound effects during interaction","tagZh":"爽快而空灵","textZh":"放松而爽快，以流畅的运动、魔幻的背景音乐和互动时闪烁的音效为特色"},"interaction":{"tag":"file upload and drag","text":"file upload to set the target image, followed by pointer movement or dragging to disturb particles and clicking to increase the repulsion force","tagZh":"文件上传与拖动","textZh":"上传文件以设定目标图像，随后通过移动或拖动指针来扰动粒子，并点击以增大排斥力"},"social":{"tag":"single-player","text":"single-player experiment focused on individual tactile interaction and personal image customization","tagZh":"单人游戏","textZh":"单人实验体验，侧重于个人触感互动和图像自定义"}},"00b8a04e-6ec0-4ee7-bad6-82477215e533":{"subject":{"tag":"ASMR sensory textures","text":"a collection of tactile sensory environments including bubble wrap, a raindrop window, zen chimes, soap slicing, mechanical keyboard keys, and colorful slime.","tagZh":"ASMR 感官质感","textZh":"一组触觉感官场景，包括气泡膜、雨滴窗户、禅意风铃、切肥皂、机械键盘按键以及五彩史莱姆。"},"gameplay":{"tag":"sensory simulation","text":"a sandbox soundboard experience focused on tactile interaction; users cycle through seven distinct scenes to trigger synthesized ASMR sounds and visual feedback without scores or objectives.","tagZh":"感官模拟","textZh":"一款聚焦触觉互动的沙盒音效板体验；用户在七个不同场景间切换，触发合成的 ASMR 音效与视觉反馈，没有分数或目标。"},"artStyle":{"tag":"minimalist dark mode","text":"sleek dark mode aesthetic using a slate and zinc palette, high-contrast glowing elements, smooth transitions, and depth-focused UI components.","tagZh":"极简暗色模式","textZh":"时尚的暗色模式美学，采用石板灰与锌灰配色，高对比度的发光元素、流畅的过渡以及注重层次感的 UI 组件。"},"mood":{"tag":"relaxing meditative","text":"soothing and therapeutic, designed for relaxation and stress relief through rhythmic audio-visual feedback.","tagZh":"放松冥想","textZh":"舒缓且疗愈，通过有节奏的视听反馈帮助放松与缓解压力。"},"interaction":{"tag":"multi-touch tapping","text":"multi-touch interactions including single taps for bubble popping and chimes, dragging for slime squishing and soap slicing, and rapid clicking for mechanical keys.","tagZh":"多点触控点按","textZh":"多点触控互动，包括单击戳破气泡与敲响风铃、拖动挤压史莱姆与切肥皂，以及快速点击机械键盘按键。"},"social":{"tag":"single-player","text":"single-player; a private meditative experience designed for individual focus and relaxation.","tagZh":"单人","textZh":"单人；一段私密的冥想体验，专为个人专注与放松而设计。"}},"000197db-e51e-4060-a4da-4256cb4299bb":{"subject":{"tag":"cellular biology simulation","text":"A petri dish filled with colorful cellular species including Infect, Cure, Toxin, Acid, and up to 110 modular rainbow factions.","tagZh":"细胞生物学模拟","textZh":"一个培养皿中充满了五彩的细胞物种，包括感染、治愈、毒素、酸液，以及多达 110 个模块化的彩虹阵营。"},"gameplay":{"tag":"cellular automata sandbox","text":"Place and manage competing cellular species in a modular rock-paper-scissors simulation. Features sandbox experimentation and objective-based levels such as outbreak survival, core defense, and population balancing.","tagZh":"细胞自动机沙盒","textZh":"在一个模块化的石头剪刀布模拟中放置并管理相互竞争的细胞物种。包含沙盒实验以及基于目标的关卡，如疫情生存、核心防御和种群平衡。"},"artStyle":{"tag":"neon cellular grid","text":"High-contrast neon pixel-style rendering on a dark grid. Features vibrant electric colors for different species within a configurable geometric containment field.","tagZh":"霓虹细胞网格","textZh":"在暗色网格上进行高对比度的霓虹像素风格渲染。在可配置的几何围栏内，为不同物种呈现鲜艳的电光色彩。"},"mood":{"tag":"captivating simulation","text":"Satisfying and hypnotic, blending the chill of a sandbox experiment with the tense pressure of containment levels.","tagZh":"引人入胜的模拟","textZh":"令人满足且如催眠般着迷，将沙盒实验的悠闲与围堵关卡的紧张压力融为一体。"},"interaction":{"tag":"brush and menu controls","text":"Primary interaction through painting with various cellular brushes and toggling simulation settings like speed, brush size, and containment shape.","tagZh":"笔刷与菜单控制","textZh":"主要通过使用各种细胞笔刷绘制，以及切换速度、笔刷大小和围栏形状等模拟设置来进行互动。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01a3c458-daf6-44bb-b703-5b81e3110a45":{"subject":{"tag":"abstract shape puzzles","text":"minimalist abstract shapes such as hearts, stars, and rockets set against a starry cosmic backdrop.","tagZh":"抽象形状拼图","textZh":"以星空宇宙为背景的极简抽象形状，如爱心、星星和火箭。"},"gameplay":{"tag":"drag-and-drop puzzle","text":"reconstruct shapes by dragging fragmented colorful pieces into a central outline; features proximity-based snapping, hint systems, and multi-level progression.","tagZh":"拖放拼图","textZh":"通过将碎裂的彩色拼块拖入中央轮廓来重构形状；具备邻近自动吸附、提示系统以及多关卡进阶。"},"artStyle":{"tag":"neon galactic","text":"vibrant neon-colored shapes on a deep navy cosmic background with glowing particles, drop shadows, and minimalist UI.","tagZh":"霓虹星系","textZh":"在深藏青色宇宙背景上呈现鲜艳的霓虹色形状，配以发光粒子、投影阴影和极简 UI。"},"mood":{"tag":"soothing and satisfying","text":"relaxing and focused atmosphere with ambient music and tactile snapping feedback for successful placement.","tagZh":"舒缓且满足","textZh":"轻松专注的氛围，配有环境音乐，成功放置时还有触感十足的吸附反馈。"},"interaction":{"tag":"drag and drop","text":"drag and drop to position pieces, with button clicks for hints and resetting levels.","tagZh":"拖放","textZh":"通过拖放来摆放拼块，并可点击按钮获取提示和重置关卡。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"01b14ec2-8d9c-43ca-9d9b-d9d7a7c68f36":{"subject":{"tag":"cybernetic maze escape","text":"a white orb being pursued by a red aggressive square within a neon-lit technological maze grid.","tagZh":"赛博迷宫逃脱","textZh":"在霓虹灯光的科技迷宫网格中，一个白色球体被一个红色的攻击性方块追逐。"},"gameplay":{"tag":"evasive maze survival","text":"maneuver through a procedurally generated maze to evade an increasingly fast chaser; arcade survival loop focused on time-based scoring and collision avoidance.","tagZh":"闪避迷宫生存","textZh":"在程序生成的迷宫中穿行，躲避速度越来越快的追逐者；一款聚焦于计时得分和避免碰撞的街机生存循环玩法。"},"artStyle":{"tag":"cyberpunk glitch aesthetic","text":"minimalist cyberpunk visuals with high-contrast neon blues and reds, dark backgrounds, glowing effects, and occasional screen-glitch distortions.","tagZh":"赛博朋克故障美学","textZh":"极简的赛博朋克视觉风格，采用高对比度的霓虹蓝与红、暗色背景、发光特效，以及偶尔出现的屏幕故障失真。"},"mood":{"tag":"tense and frantic","text":"intense and high-pressure atmosphere driven by a relentless pursuer and increasing movement speed.","tagZh":"紧张而狂乱","textZh":"由穷追不舍的追逐者和不断加快的移动速度所营造出的激烈高压氛围。"},"interaction":{"tag":"pointer-follow movement","text":"drag or move pointer to guide the player character, utilizing smooth lerp-based following for navigation through tight corridors.","tagZh":"指针跟随移动","textZh":"拖动或移动指针来引导玩家角色，利用平滑的线性插值跟随在狭窄通道中穿行。"},"social":{"tag":"single-player","text":"single-player game with a local high-score system tracking survival time.","tagZh":"单人","textZh":"单人游戏，配有记录生存时间的本地高分系统。"}},"002591e2-fb3a-4eeb-8ddd-477d2e20ff35":{"subject":{"tag":"stickman crowd arena","text":"a hero stickman surrounded by a massive procedural crowd of thousands of colorful stickmen in an infinite open space","tagZh":"火柴人群竞技场","textZh":"在无限开阔的空间中，一个英雄火柴人被成千上万个五彩火柴人组成的庞大程序化人群所包围"},"gameplay":{"tag":"crowd manipulation sandbox","text":"control a hero moving through a dense crowd with the ability to switch between attracting or repelling entities; features shooting mechanics to clear paths and a distance tracking progression system","tagZh":"人群操控沙盒","textZh":"控制一个英雄在密集人群中移动，可在吸引或排斥实体之间切换；配有清出路径的射击机制以及基于距离的进阶追踪系统"},"artStyle":{"tag":"minimalist stickman sketch","text":"minimalist hand-drawn stickman aesthetic using Canvas2D rendering with dynamic color palettes and a scalable camera view","tagZh":"极简火柴人手绘","textZh":"采用 Canvas2D 渲染的极简手绘火柴人美学，配以动态配色和可缩放的镜头视角"},"mood":{"tag":"chaotic yet satisfying","text":"a mix of chaotic energy from high entity counts and satisfying feedback through smooth crowd movement and responsive interaction","tagZh":"混乱却满足","textZh":"既有海量实体带来的混乱能量，又有流畅人群移动和灵敏互动带来的满足反馈"},"interaction":{"tag":"drag-to-move with pinch zoom","text":"drag or touch to direct movement and aim, pinch-to-zoom or mouse wheel for camera scale, and dedicated buttons for shooting and toggling crowd behavior modes","tagZh":"拖动移动配双指缩放","textZh":"拖动或触摸来指引移动和瞄准，双指捏合或鼠标滚轮调整镜头缩放，并有专用按钮用于射击和切换人群行为模式"},"social":{"tag":"single-player","text":"single-player experience focused on sandbox interaction and distance high-scores","tagZh":"单人","textZh":"单人体验，聚焦于沙盒互动和距离高分"}},"020cda94-0163-4b6c-8092-bd321bdf3400":{"subject":{"tag":"photo manipulation portraits","text":"a collection of human face portraits and character images available for visual transformation.","tagZh":"照片处理肖像","textZh":"一组可供视觉变形处理的人脸肖像和角色图像。"},"gameplay":{"tag":"creative image distortion","text":"interactive image distortion sandbox where users apply stretch and swirl effects to photos; features a reset mechanic and various brush modes for real-time visual warping.","tagZh":"创意图像扭曲","textZh":"一款互动式图像扭曲沙盒，用户可对照片施加拉伸和旋涡效果；具备重置机制和多种笔刷模式，实现实时视觉变形。"},"artStyle":{"tag":"modern dark interface","text":"clean dark-mode UI with a grid-based selection menu, featuring high-contrast white text and glassmorphism buttons over a black canvas.","tagZh":"现代暗色界面","textZh":"简洁的暗色模式 UI，配有网格式选择菜单，在黑色画布上呈现高对比度的白色文字和玻璃拟态按钮。"},"mood":{"tag":"playful and silly","text":"playful and experimental, encouraging humorous and exaggerated facial transformations.","tagZh":"俏皮搞怪","textZh":"俏皮而充满实验性，鼓励幽默夸张的面部变形。"},"interaction":{"tag":"drag and swipe warping","text":"drag and swipe gestures to manipulate pixels in real-time using WebGL-powered brush tools, with button toggles for tool modes.","tagZh":"拖动滑动变形","textZh":"通过拖动和滑动手势，借助 WebGL 驱动的笔刷工具实时操控像素，并可用按钮切换工具模式。"},"social":{"tag":"single-player","text":"single-player","tagZh":"单人","textZh":"单人"}},"0097dd62-ef76-4220-a5b3-df8948602165":{"subject":{"tag":"neon physics tycoon","text":"falling gravity-affected spheres and glowing lines set in a dark synthwave-inspired neon digital environment","tagZh":"霓虹物理大亨","textZh":"在暗色的合成波风格霓虹数字环境中，受重力影响下落的球体和发光的线条"},"gameplay":{"tag":"drawing physics idle","text":"draw temporary lines to bounce falling balls and earn money; invest currency in upgrades for ball value, spawn rate, and line duration to progress through an incremental economic loop","tagZh":"绘线物理放置","textZh":"绘制临时线条弹起下落的小球以赚钱；将货币投入升级小球价值、生成速率和线条持续时间，从而推进增量式经济循环"},"artStyle":{"tag":"cyberpunk neon minimalist","text":"high
